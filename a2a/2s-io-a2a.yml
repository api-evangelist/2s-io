  host: 2s.io
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host (https://2s.io), the MCP host
    (https://2s.io/mcp) and the A2A JSON-RPC host (https://2s.io/a2a) — 2s runs everything on one
    Vercel-hosted Next.js origin. The site has no catch-all: a negative-control path under /.well-known/
    (2s-io-… -7f3a9c.json) returned a real HTTP 404 (the Next.js error document), as did /.well-known/security.txt
    and the OAuth/OIDC discovery paths, so the 200 on agent-card.json is a served document. The legacy
    /.well-known/agent.json ALSO answers 200, but its body is NOT an A2A card: it is an EIP-8004 / ERC-8004
    agent-registration file ("type": "https://eips.ethereum.org/EIPS/eip-8004") that lists the MCP, A2A,
    OpenAPI and directory services and an on-chain registration (agentId 57911 on eip155:8453). It is saved
    under well-known/2s-io-agent.json and not graded as an A2A card. Ownership is not in question: the card's
    provider.organization is "2s" with provider.url https://2s.io, the OpenAPI at the same host titles itself
    "2s — the (most) everything API" with contact alley@2s.io, and the provider's own APIs.json, api-catalog
    linkset, x402 manifest and MCP server card all cross-reference this exact card URL.
