    registration at BOTH /.well-known/agent.json and /.well-known/erc8004.json, a Wildcard agents.json, an
    x402 service manifest, an MCP server card (SEP-1649), a response-attestation descriptor, an APIs.json
    index at /apis.json and an llms.txt. It serves NO security.txt (RFC 9116), no OpenID/OAuth discovery
    and no RFC 9728 protected-resource metadata for its MCP server (the MCP host is the apex, so the apex
    rows below are the MCP-host rows). Every miss is a real 404 (the Next.js error document, 526 KB of HTML
    with a 404 status), and a negative-control path that cannot exist also 404s, so the 200s are served
    documents. www.2s.io presents a TLS certificate that does not cover the www name (curl error 60); with
    verification disabled it 307s every path to the apex, and plain http://www.2s.io 308s to https://www.2s.io,
    which then fails TLS — the www alias is effectively unreachable over HTTPS.
