free_tier:
  trial: '?trial=1 or X-2s-Trial: 1 — one free real call per endpoint per hour, no wallet (excluded: feedback_send)'
  a2a_discovery: the A2A discover-endpoints skill is free per the agent card; the same lookup over REST (search_endpoints)
    is $0.0025
  discovery_documents: /api/directory, /registry.json, /openapi.json, /llms.txt, /catalog.txt, /endpoints.txt, /status.json,
    /changelog.json all free and unauthenticated
billing_mechanics:
  exact: default x402 scheme — pay the quoted amount
  upto: 'AI endpoints — Permit2 authorization for the quoted max, settled at actual usage, floor $0.001 (changelog
    1.80.0: a real call authorized $0.0549 and settled $0.0013)'
  batch: batch_run — up to 50 sub-calls, one payment, exact sum, atomic; excludes variable-priced and metered-upstream
    endpoints
  failure: '"You pay only for calls that succeed. A failed handler is never charged on-chain." (status page)'
  gas: paid by the facilitator (Coinbase CDP); the caller needs only USDC
  flat_fee_primitives: watchers_* $0.125 per arm (27 kinds, 30-day/25-fire default window); schedule_create $0.125;
    store/lock/queue/pubsub calls $0.005
payment_terms:
  asset: USDC
  rails:
  - Base (eip155:8453)
  - Solana mainnet
  treasury:
    base: '0x2b6D4988Db4723E6908Db86Ab2b8dFBc51FC32C5'
    solana: TW6ntaGzvj63ZgPjszd4FCGmVTGfzv1MAYZbjYcyWhn
  refunds: none through the API; the commitment is that failed calls are not charged
  terms_of_service: none published (no /terms, /tos, /legal page found — all 404)
