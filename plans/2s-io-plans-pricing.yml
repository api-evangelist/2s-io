plan_count: 0
currency: USD, settled as USDC
model: pay-per-call in USDC via x402 on Base or Solana; no tiers, no subscription, no account, no minimum, no card
  payments
summary: 2s publishes no plans or tiers. Every one of the 575 endpoints carries its own per-call price in the contract
  (x-2s-price) and in the machine-readable directory, quoted again in the 402 before payment. Prices are read here
  from the OpenAPI itself, so method is probed. The only free allowance is trial mode (one free real call per endpoint
  per hour) and the free A2A discovery skill; the only volume mechanism is batch_run (up to 50 calls, price = exact
  sum, no discount). AI endpoints are variable-priced (quoted per request in the 402) and support upto billing (authorize
  the max, pay actual usage).
