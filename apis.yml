apis:
- aid: 2s-io:2s-api
  name: 2s API
  description: >-
    The full 2s REST catalog: 575 operations (470 GET, 105 POST) in one OpenAPI 3.1.0 document with servers[]
    https://2s.io, one tag per operation across 112 groups, a unique operationId (group_name) and an x-2s-id
    (group.name) on every operation, a per-call price in x-2s-price / x-payment-info, and a single x402Payment
    security scheme (PAYMENT-SIGNATURE header) applied everywhere. Responses use a normalized {data {ok, items,
    total, source, meta}, meta} envelope with per-response provenance, or raw bytes on ten media endpoints.
    Stateful groups (store, lock, queue, pubsub, schedule, watchers) are scoped to the paying wallet. Every
    endpoint accepts ?trial=1 for one free real call per hour; batch_run runs up to 50 calls behind one payment.
  humanURL: https://2s.io/discover
  baseURL: https://2s.io
  tags:
  - Agents
  - x402
  - Public Records
  - Finance
  - Crypto
  - Security
  - EDI
  - AI Gateway
  - Agent Infrastructure
  properties:
  - type: OpenAPI
    url: openapi/2s-io-openapi.json
  - type: OpenAPI
    name: 2s OpenAPI 3.1 (provider-hosted)
    url: https://2s.io/openapi.json
  - type: Overlay
    url: overlays/2s-io-openapi-overlay.yaml
  - type: Documentation
    url: https://2s.io/llms.txt
  - type: APIReference
    url: https://2s.io/discover
  - type: Webhooks
    url: asyncapi/2s-io-watchers-webhooks.yml
- aid: 2s-io:2s-mcp-server
  name: 2s MCP Server
  description: >-
    Remote Model Context Protocol server at https://2s.io/mcp (Streamable HTTP, POST only, protocol version
    2025-06-18, serverInfo 2s.io 1.0.0). initialize and tools/list answer anonymously with 575 tools — one per
    REST operation, named by the spec's x-2s-id, each carrying a real inputSchema; resources/list and
    prompts/list are not implemented. Paid tool calls are settled through x402 by a hosted signer that takes
    the caller's EVM private key in an X-EVM-Private-Key header, which the provider's own docs recommend
    against in favour of the local stdio server, npx -y @2sio/mcp (npm @2sio/mcp 1.82.0), that keeps the key
    on the caller's machine. Both accept a trial mode. A SEP-1649 server card is published at
    /.well-known/mcp/server-card.json.
  humanURL: https://2s.io/learn/x402/mcp
  baseURL: https://2s.io/mcp
  tags:
  - MCP
  - agent-native
  - x402
  properties:
  - type: MCPServer
    url: mcp/2s-io-mcp.yml
  - type: MCPServer
    name: 2s hosted MCP endpoint (Streamable HTTP)
    url: https://2s.io/mcp
  - type: ToolCrosswalk
    url: mcp/2s-io-tool-crosswalk.yml
  - type: Documentation
    url: https://2s.io/learn/x402/mcp
- aid: 2s-io:2s-a2a-agent
  name: 2s A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://2s.io/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 1.0.0, provider 2s) advertising a single skill,
    discover-endpoints — send a natural-language task as text/plain to the JSON-RPC endpoint at
    https://2s.io/a2a and receive the best-matching 2s endpoints (id, path, method, group, description,
    per-call price) as application/json, ranked deterministically over the live catalog. Discovery is free; the
    endpoints it returns are x402-paid. The endpoint implements only message/send (tasks/get and the extended
    card return -32601); streaming, push notifications and state history are declared unsupported.
  humanURL: https://2s.io/llms.txt
  baseURL: https://2s.io/a2a
  tags:
  - A2A
  - agent-native
  - x402
  properties:
  - type: AgentCard
    url: a2a/2s-io-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://2s.io/.well-known/agent-card.json
