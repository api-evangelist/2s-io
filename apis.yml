apis:
- aid: 2s-io:2s-mcp-server
  name: 2s MCP Server
  description: >-
    Remote Model Context Protocol server at https://2s.io/mcp (Streamable HTTP, POST only, protocol version
    2025-06-18, serverInfo 2s.io 1.0.0). initialize and tools/list answer anonymously with 575 tools —
    one per REST operation, named by the spec's x-2s-id, each carrying a real inputSchema; resources/list
    and prompts/list are not implemented. Paid tool calls are settled through x402 by a hosted signer
    that takes the caller's EVM private key in an X-EVM-Private-Key header, which the provider's own docs
    recommend against in favour of the local stdio server, npx -y @2sio/mcp (npm @2sio/mcp 1.82.0), that
    keeps the key on the caller's machine. Both accept a trial mode. A SEP-1649 server card is published
    at /.well-known/mcp/server-card.json.
  humanURL: https://2s.io/learn/x402/mcp
  baseURL: https://2s.io/mcp
  tags:
  - MCP
  - Agent-Native
  - x402
  tags_raw:
  - MCP
  - agent-native
  - x402
  properties:
  - type: MCPServer
    url: mcp/2s-io-mcp.yml
  - type: MCPServer
    name: 2s hosted MCP endpoint (Streamable HTTP)
    url: https://2s.io/mcp
  - type: ToolCrosswalk
    url: mcp/2s-io-tool-crosswalk.yml
  - type: Documentation
    url: https://2s.io/learn/x402/mcp
- aid: 2s-io:2s-a2a-agent
  name: 2s A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://2s.io/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 1.0.0, provider 2s) advertising a single skill,
    discover-endpoints — send a natural-language task as text/plain to the JSON-RPC endpoint at https://2s.io/a2a
    and receive the best-matching 2s endpoints (id, path, method, group, description, per-call price)
    as application/json, ranked deterministically over the live catalog. Discovery is free; the endpoints
    it returns are x402-paid. The endpoint implements only message/send (tasks/get and the extended card
    return -32601); streaming, push notifications and state history are declared unsupported.
  humanURL: https://2s.io/llms.txt
  baseURL: https://2s.io/a2a
  tags:
  - A2A
  - Agent-Native
  - x402
  tags_raw:
  - A2A
  - agent-native
  - x402
