aid: 2s-io
name: 2s
description: >-
  2s ("the (most) everything API", 2s.io) is a pay-per-call REST API built for AI agents: 575 endpoints across
  112 groups on one origin — US public records and government data, company and legal identifiers (GLEIF,
  OFAC, state registries), SEC filings, crypto and web3, security and CVEs, patents and case law, medical
  codes, weather and geocoding, ANSI X12 / EDIFACT EDI, an OpenAI-compatible AI gateway (chat, image,
  multi-model council) and wallet-scoped agent infrastructure (kv/doc/vector/blob store, locks, queues,
  schedules, pub/sub and 26 kinds of signed-callback watchers). There are no accounts and no API keys: every
  call is paid in USDC on Base or Solana through the x402 protocol (HTTP 402 → sign → retry), with a free trial
  call per endpoint per hour and actual-usage "upto" billing on AI endpoints. The same catalog is published as
  an OpenAPI 3.1.0 contract at https://2s.io/openapi.json, a remote MCP server at https://2s.io/mcp (plus the
  npx @2sio/mcp local server), an A2A 0.3.0 agent card whose one skill is endpoint discovery, an RFC 9727 API
  catalog, an APIs.json index, an llms.txt, an MCP server card, an x402 manifest and an ERC-8004 on-chain agent
  registration. Maintained by an individual operator (alley@2s.io); the SDK monorepo is github.com/2s-io/sdk.
