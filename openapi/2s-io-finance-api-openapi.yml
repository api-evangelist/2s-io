openapi: 3.2.0
info:
  title: 2s — the (most) everything Finance API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: finance
paths:
  /api/finance/amortize:
    get:
      tags:
      - finance
      summary: Compute a loan or mortgage amortization schedule
      description: 'Compute a loan or mortgage amortization schedule. Pass principal, annualRatePct (e.g. 6.5), and the term as termMonths or termYears; optional extraMonthly adds extra principal each month (shortening the term). Returns the fixed monthly payment, total interest, total paid, the actual payoff month count, and the full month-by-month schedule (each row: payment, principal, interest, remaining balance). Handles the 0% case and trims the final payment exactly. Deterministic — the ground-truth answer for a loan/mortgage/auto-finance question instead of an LLM approximating compound interest. No external calls.'
      operationId: finance_amortize
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [amortization result with full schedule]; total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            principal:
                              type: number
                            annualRatePct:
                              type: number
                            termMonths:
                              type: integer
                            monthlyRate:
                              type: number
                            monthlyPayment:
                              type: number
                            extraMonthly:
                              type: number
                            payoffMonths:
                              type: integer
                            totalInterest:
                              type: number
                            totalPaid:
                              type: number
                            schedule:
                              type: array
                              items:
                                type: object
                                properties:
                                  month:
                                    type: integer
                                  payment:
                                    type: number
                                  principal:
                                    type: number
                                  interest:
                                    type: number
                                  balance:
                                    type: number
                                required:
                                - month
                                - payment
                                - principal
                                - interest
                                - balance
                                additionalProperties: false
                          required:
                          - principal
                          - annualRatePct
                          - termMonths
                          - monthlyRate
                          - monthlyPayment
                          - extraMonthly
                          - payoffMonths
                          - totalInterest
                          - totalPaid
                          - schedule
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: finance.amortize
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      parameters:
      - name: principal
        in: query
        required: true
        description: Principal.
        schema:
          type: number
      - name: annualRatePct
        in: query
        required: true
        description: Annual rate pct.
        schema:
          type: number
      - name: termMonths
        in: query
        required: false
        description: Term months.
        schema:
          type: integer
          minimum: 1
          maximum: 1200
      - name: termYears
        in: query
        required: false
        description: Term years.
        schema:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 100
      - name: extraMonthly
        in: query
        required: false
        description: Extra monthly.
        schema:
          type: number
          minimum: 0
      - $ref: '#/components/parameters/TrialMode'
  /api/finance/bank-id-resolve:
    get:
      tags:
      - finance
      summary: Resolve a bank / financial institution across identifier
      description: 'Resolve a bank / financial institution across identifier systems. Give exactly one of bic (SWIFT/BIC), lei, or fdic_cert and get the others back: LEI, every ISO 9362 BIC the institution registers, the FDIC institution record (when matched), jurisdiction, and a canonical name. The BICLEI bridge is authoritative and live from GLEIF (the LEI record carries the institution BIC list, CC0); anchoring on an FDIC certificate returns the FDIC BankFind record and best-effort name-matches it to a GLEIF LEI (flagged via bridge). There is no free FDIC-certBIC table, so the FDICGLEIF link is name-match only -- per-source status + bridge make any partial resolve explicit. Sources: GLEIF (CC0) + FDIC BankFind (US public domain).'
      operationId: finance_bank-id-resolve
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [one resolved institution with LEI, BICs, FDIC record + per-source status]; total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            resolvedFrom:
                              type: string
                              enum:
                              - bic
                              - lei
                              - fdic_cert
                            name:
                              type: string
                              nullable: true
                            lei:
                              type: string
                              nullable: true
                            leiName:
                              type: string
                              nullable: true
                            jurisdiction:
                              type: string
                              nullable: true
                            bics:
                              type: array
                              items:
                                type: string
                              description: All ISO 9362 BICs GLEIF associates with the LEI.
                            fdic:
                              type: object
                              properties:
                                cert:
                                  type: string
                                name:
                                  type: string
                                city:
                                  type: string
                                  nullable: true
                                state:
                                  type: string
                                  nullable: true
                                active:
                                  type: boolean
                              required:
                              - cert
                              - name
                              - city
                              - state
                              - active
                              additionalProperties: false
                              nullable: true
                            bridge:
                              type: string
                              enum:
                              - bic-to-lei
                              - direct-lei
                              - fdic-name-match
                              - partial
                              - none
                            sources:
                              type: object
                              properties:
                                gleif:
                                  type: string
                                fdic:
                                  type: string
                              required:
                              - gleif
                              - fdic
                              additionalProperties: false
                          required:
                          - resolvedFrom
                          - name
                          - lei
                          - leiName
                          - jurisdiction
                          - bics
                          - fdic
                          - bridge
                          - sources
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: finance.bank-id-resolve
      x-2s-version: null
      x-2s-price:
        usd: 0.012
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.012000'
        protocols:
        - x402: {}
      parameters:
      - name: bic
        in: query
        required: false
        description: ISO 9362 SWIFT/BIC, 8 or 11 chars, e.g. BOFAUS3N.
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{8}([A-Za-z0-9]{3})?$
      - name: lei
        in: query
        required: false
        description: 20-char LEI.
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{20}$
      - name: fdic_cert
        in: query
        required: false
        description: FDIC certificate number, e.g. 3511.
        schema:
          type: string
          pattern: ^\d{1,7}$
      - $ref: '#/components/parameters/TrialMode'
  /api/finance/bin:
    get:
      tags:
      - finance
      summary: Identify a payment card from its BIN/IIN (Bank
      description: Identify a payment card from its BIN/IIN (Bank Identification Number — the leading 6-8 digits). Pass the BIN or the first digits of a card number and get the card brand (Visa, Mastercard, …), card type (debit/credit), category, issuing bank, and country (ISO alpha-2 + name). Longest-prefix match against an open community dataset (CC-BY). The BIN identifies the issuer/brand/country only — never the cardholder or account number. For payment routing, fraud checks, and checkout UX.
      operationId: finance_bin
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [one BIN result]; total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            query:
                              type: object
                              properties:
                                input:
                                  type: string
                                matchedBin:
                                  type: string
                                  nullable: true
                              required:
                              - input
                              - matchedBin
                              additionalProperties: false
                            found:
                              type: boolean
                            bin:
                              type: string
                              nullable: true
                            brand:
                              type: string
                              nullable: true
                            cardType:
                              type: string
                              nullable: true
                            category:
                              type: string
                              nullable: true
                            issuer:
                              type: string
                              nullable: true
                            countryAlpha2:
                              type: string
                              nullable: true
                            countryName:
                              type: string
                              nullable: true
                            bankUrl:
                              type: string
                              nullable: true
                            source:
                              $ref: '#/components/schemas/Source'
                            note:
                              type: string
                          required:
                          - query
                          - found
                          - bin
                          - brand
                          - cardType
                          - category
                          - issuer
                          - countryAlpha2
                          - countryName
                          - bankUrl
                          - source
                          - note
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: finance.bin
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      parameters:
      - name: bin
        in: query
        required: true
        description: BIN/IIN or leading card digits.
        schema:
          type: string
          minLength: 6
          maxLength: 19
      - $ref: '#/components/parameters/TrialMode'
  /api/finance/central-bank-rates:
    get:
      tags:
      - finance
      summary: Headline central-bank policy/benchmark rates side-by-side
      description: 'Headline central-bank policy/benchmark rates side-by-side in one call, normalized: US (Fed effective funds rate), Euro area (ECB deposit facility rate), Japan (BoJ call-money benchmark), United Kingdom (SONIA, which tracks the BoE Bank Rate). Each result names the bank, country, the rate, the as-of date, the FRED series id, and a label stating exactly which instrument it is (banks don''t all publish the same policy instrument). Pass bank to filter (one of: fed, ecb, boj, boe), or omit for all. Source: FRED (St. Louis Fed).'
      operationId: finance_central-bank-rates
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = central-bank rates (bank, country, code, rate, date, seriesId, label); total = banks returned.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            bank:
                              type: string
                            country:
                              type: string
                            code:
                              type: string
                            rate:
                              type: number
                              nullable: true
                            date:
                              type: string
                              nullable: true
                            seriesId:
                              type: string
                            label:
                              type: string
                          required:
                          - bank
                          - country
                          - code
                          - rate
                          - date
                          - seriesId
                          - label
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: finance.central-bank-rates
      x-2s-version: null
      x-2s-price:
        usd: 0.012
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.012000'
        protocols:
        - x402: {}
      parameters:
      - name: bank
        in: query
        required: false
        description: 'Bank code to filter. One of: fed, ecb, boj, boe. Omit for all.'
        schema:
          type: string
          enum:
          - fed
          - ecb
          - boj
          - boe
      - $ref: '#/components/parameters/TrialMode'
  /api/finance/cik-ticker:
    get:
      tags:
      - finance
      summary: Resolve SEC CIK ticker in both directions
      description: 'Resolve SEC CIK ticker in both directions. Pass a ticker to get its CIK; pass a CIK to get every ticker the issuer has (each share class, e.g. GOOG + GOOGL), each with its listing exchange (Nasdaq, NYSE, etc.) and the canonical company name. The CIK is the key to everything in EDGAR -- filings, XBRL facts, Form 4 insider trades, 13F holdings -- so this is the join that turns a ticker an agent has into the identifier EDGAR actually indexes by (and back). Data: SEC company_tickers_exchange.json (US public domain), cached and refreshed daily. Distinct from finance.security-resolve, which also crosses into FIGI/LEI/ISIN; this one is the focused, exchange-aware CIKticker map.'
      operationId: finance_cik-ticker
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [one issuer with cik, name, and all tickers+exchanges]; total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            resolvedFrom:
                              type: string
                              enum:
                              - cik
                              - ticker
                            cik:
                              type: string
                              description: 10-digit zero-padded SEC CIK.
                            name:
                              type: string
                              description: Canonical issuer name (SEC).
                            tickers:
                              type: array
                              items:
                                type: object
                                properties:
                                  ticker:
                                    type: string
                                  exchange:
                                    type: string
                                    nullable: true
                                required:
                                - ticker
                                - exchange
                                additionalProperties: false
                          required:
                          - resolvedFrom
                          - cik
                          - name
                          - tickers
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: finance.cik-ticker
      x-2s-version: null
      x-2s-price:
        usd: 0.009
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.009000'
        protocols:
        - x402: {}
      parameters:
      - name: cik
        in: query
        required: false
        description: SEC CIK, leading zeros optional, e.g. 320193 or 0000320193.
        schema:
          type: string
          minLength: 1
          maxLength: 13
      - name: ticker
        in: query
        required: false
        description: US stock ticker, e.g. AAPL or GOOGL.
        schema:
          type: string
          minLength: 1
          maxLength: 12
      - $ref: '#/components/parameters/TrialMode'
  /api/finance/company-facts:
    get:
      tags:
      - finance
      summary: Curated XBRL financial metrics for a US public company by
      description: 'Curated XBRL financial metrics for a US public company by stock ticker. Pulls SEC EDGAR''s companyfacts JSON (per-CIK XBRL filings) and extracts a top-line set of ~15 financial metrics with their most recent annual + quarterly values. Each metric returns: end date, start date (or null for balance-sheet snapshots), value, fiscal year/period, originating form (10-K/10-Q), and filed date. Available metric keys (pass any comma-separated subset via the metrics param, or omit to get all): revenue, grossProfit, operatingIncome, netIncome, eps, epsDiluted, rdExpense, totalAssets, totalLiabilities, stockholdersEquity, cash, longTermDebt, operatingCashFlow, capex, sharesOutstanding. Backed by SEC.gov; underlying data is public-domain US government records.'
      operationId: finance_company-facts
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = curated XBRL metric series (~15 top-line financial facts, each with recent annual + quarterly history); meta = company identity + query echo. For fundamentals + filings + insider trades merged by ticker in one call, see /api/finance/company-profile.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            concept:
                              type: string
                            label:
                              type: string
                            namespace:
                              type: string
                            unit:
                              type: string
                            annual:
                              type: array
                              items:
                                type: object
                                properties:
                                  end:
                                    type: string
                                  start:
                                    type: string
                                    nullable: true
                                  val:
                                    type: number
                                  fiscalYear:
                                    type: integer
                                  fiscalPeriod:
                                    type: string
                                  form:
                                    type: string
                                  filed:
                                    type: string
                                required:
                                - end
                                - start
                                - val
                                - fiscalYear
                                - fiscalPeriod
                                - form
                                - filed
                                additionalProperties: false
                            quarterly:
                              type: array
                              items:
                                type: object
                                properties:
                                  end:
                                    type: string
                                  start:
                                    type: string
                                    nullable: true
                                  val:
                                    type: number
                                  fiscalYear:
                                    type: integer
                                  fiscalPeriod:
                                    type: string
                                  form:
                                    type: string
                                  filed:
                                    type: string
                                required:
                                - end
                                - start
                                - val
                                - fiscalYear
                                - fiscalPeriod
                                - form
                                - filed
                                additionalProperties: false
                          required:
                          - key
                          - concept
                          - label
                          - namespace
                          - unit
                          - annual
                          - quarterly
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          query:
                            type: object
                            properties:
                              ticker:
                                type: string
                              metrics:
                                type: string
                                nullable: true
                              annualLimit:
                                type: number
                              quarterlyLimit:
                                type: number
                            required:
                            - ticker
                            - metrics
                            - annualLimit
                            - quarterlyLimit
                            additionalProperties: false
                          cik:
                            type: string
                          ticker:
                            type: string
                          entityName:
                            type: string
                        required:
                        - query
                        - cik
                        - ticker
                        - entityName
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: finance.company-facts
      x-2s-version: null
      x-2s-price:
        usd: 0.012
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.012000'
        protocols:
