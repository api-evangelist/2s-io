            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            resolvedFrom:
                              type: string
                              enum:
                              - ticker
                              - isin
                              - lei
                            ticker:
                              type: string
                              nullable: true
                            cik:
                              type: string
                              nullable: true
                              description: 10-digit zero-padded SEC CIK.
                            name:
                              type: string
                              nullable: true
                              description: Canonical issuer name.
                            figi:
                              type: object
                              properties:
                                figi:
                                  type: string
                                  nullable: true
                                compositeFIGI:
                                  type: string
                                  nullable: true
                                shareClassFIGI:
                                  type: string
                                  nullable: true
                                exchCode:
                                  type: string
                                  nullable: true
                              required:
                              - figi
                              - compositeFIGI
                              - shareClassFIGI
                              - exchCode
                              additionalProperties: false
                              nullable: true
                            lei:
                              type: string
                              nullable: true
                            leiName:
                              type: string
                              nullable: true
                            leiResolvedBy:
                              type: string
                              enum:
                              - isin
                              - name-match
                              - direct
                              nullable: true
                              description: How the LEI was resolved; name-match is best-effort, verify leiName.
                            isins:
                              type: array
                              items:
                                type: string
                            sources:
                              type: object
                              properties:
                                sec:
                                  type: string
                                figi:
                                  type: string
                                gleif:
                                  type: string
                              required:
                              - sec
                              - figi
                              - gleif
                              additionalProperties: false
                          required:
