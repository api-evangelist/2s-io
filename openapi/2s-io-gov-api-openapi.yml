openapi: 3.2.0
info:
  title: 2s — the (most) everything Gov API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: gov
paths:
  /api/gov/bea-gdp:
    get:
      tags:
      - gov
      summary: Quarterly real GDP by US state from the Bureau of Economic
      description: Quarterly real GDP by US state from the Bureau of Economic Analysis (BEA) Regional accounts — all-industry total, in millions of chained (inflation-adjusted) dollars. Requires state (2-letter); optionally a specific year (defaults to the last 5 years). Returns the state name plus GDP observations (period like 2025Q2, real GDP in millions USD, unit), newest quarter first. Free, public-domain (BEA). Authoritative state economic-output data an LLM cannot recall — for economic research, regional analysis, and market sizing.
      operationId: gov_bea-gdp
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [one state GDP result]; total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            query:
                              type: object
                              properties:
                                state:
                                  type: string
                                geoFips:
                                  type: string
                                year:
                                  type: string
                                limit:
                                  type: number
                              required:
                              - state
                              - geoFips
                              - year
                              - limit
                              additionalProperties: false
                            geoName:
                              type: string
                              nullable: true
                            returned:
                              type: number
                            observations:
                              type: array
                              items:
                                type: object
                                properties:
                                  period:
                                    type: string
                                    nullable: true
                                  realGdpMillionsUSD:
                                    type: number
                                    nullable: true
                                  unit:
                                    type: string
                                    nullable: true
                                required:
                                - period
                                - realGdpMillionsUSD
                                - unit
                                additionalProperties: false
                            source:
                              $ref: '#/components/schemas/Source'
                            note:
                              type: string
                          required:
                          - query
                          - geoName
                          - returned
                          - observations
                          - source
                          - note
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: gov.bea-gdp
      x-2s-version: null
      x-2s-price:
        usd: 0.0027
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002700'
        protocols:
        - x402: {}
      parameters:
      - name: state
        in: query
        required: true
        description: 2-letter US state/territory code.
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: year
        in: query
        required: false
        description: Four-digit calendar year.
        schema:
          type: integer
          minimum: 1960
          maximum: 2100
      - name: limit
        in: query
        required: false
        description: Maximum number of results to return.
        schema:
          type: integer
          minimum: 1
          maximum: 40
      - $ref: '#/components/parameters/TrialMode'
  /api/gov/bill-summaries:
    get:
      tags:
      - gov
      summary: Stream the latest US Congressional bill summaries via
      description: Stream the latest US Congressional bill summaries via Congress.gov. Each row is a CRS-authored summary attached to a specific version of a bill (Introduced, Reported to House, Engrossed in Senate, Public Law, etc.). Filter by congress + bill type. Returns the underlying bill metadata + summary text + version code + action date. Use this for change-detection on bills you care about, or to power agent-side "what did Congress just pass" feeds.
      operationId: gov_bill-summaries
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = CRS bill summaries (bill metadata + summary text + version code + action date); total = upstream match count.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            actionDate:
                              type: string
                              nullable: true
                            actionDesc:
                              type: string
                              nullable: true
                            bill:
                              type: object
                              additionalProperties: {}
                              nullable: true
                            currentChamber:
                              type: string
                              nullable: true
                            currentChamberCode:
                              type: string
                              nullable: true
                            lastSummaryUpdateDate:
                              type: string
                              nullable: true
                            text:
                              type: string
                              nullable: true
                            updateDate:
                              type: string
                              nullable: true
                            versionCode:
                              type: string
                              nullable: true
                          required:
                          - actionDate
                          - actionDesc
                          - bill
                          - currentChamber
                          - currentChamberCode
                          - lastSummaryUpdateDate
                          - text
                          - updateDate
                          - versionCode
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: gov.bill-summaries
      x-2s-version: null
      x-2s-price:
        usd: 0.003
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
