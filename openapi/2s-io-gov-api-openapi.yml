  /api/gov/carrier-safety:
    get:
      tags:
      - gov
      summary: FMCSA motor-carrier (trucking/bus company) safety profile
      description: 'FMCSA motor-carrier (trucking/bus company) safety profile. Pass dot (USDOT number) for the full record: legal/DBA name, state, interstate/intrastate operation, operating-authority status (allowedToOperate), FMCSA safety rating, fleet size (drivers + power units), crash history (total/fatal/injury/tow-away), roadside-inspection history with driver + vehicle out-of-service rates, and the CSA BASIC measures (Unsafe Driving, Hours-of-Service, Driver Fitness, Controlled Substances, Vehicle Maintenance, Hazmat, Crash Indicator) with violation counts. Or pass name to search → matching carriers with their DOT numbers. Free, public-domain US DOT data (keyed). For commercial-auto/freight underwriting, broker/shipper vetting, and vendor due diligence — the authorization + safety record an agent can''t get from training.'
      operationId: gov_carrier-safety
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                        - carrier
                        - search
                      query:
                        type: object
                        properties:
                          dot:
                            type: number
                            nullable: true
                          name:
                            type: string
                            nullable: true
                        required:
                        - dot
                        - name
                        additionalProperties: false
                      found:
                        type: boolean
                      carrier:
                        type: object
                        properties:
                          dotNumber:
                            type: number
                            nullable: true
                          legalName:
                            type: string
                            nullable: true
                          dbaName:
                            type: string
                            nullable: true
                          physicalState:
                            type: string
                            nullable: true
                          operation:
                            type: string
                            nullable: true
                          allowedToOperate:
                            type: boolean
                            nullable: true
                          statusCode:
                            type: string
                            nullable: true
                          safetyRating:
                            type: string
                            nullable: true
                          safetyRatingDate:
                            type: string
                            nullable: true
                          totalDrivers:
                            type: number
                            nullable: true
                          totalPowerUnits:
                            type: number
                            nullable: true
                        required:
                        - dotNumber
                        - legalName
                        - dbaName
                        - physicalState
                        - operation
                        - allowedToOperate
                        - statusCode
                        - safetyRating
                        - safetyRatingDate
                        - totalDrivers
                        - totalPowerUnits
                        additionalProperties: false
                        nullable: true
                      crashes:
                        type: object
                        properties:
                          total:
                            type: number
                            nullable: true
                          fatal:
                            type: number
                            nullable: true
                          injury:
                            type: number
                            nullable: true
                          towaway:
                            type: number
                            nullable: true
                        required:
                        - total
                        - fatal
                        - injury
                        - towaway
                        additionalProperties: false
                        nullable: true
                      inspections:
                        type: object
                        properties:
                          driverTotal:
                            type: number
                            nullable: true
                          driverOutOfService:
                            type: number
                            nullable: true
                          driverOosRate:
                            type: number
                            nullable: true
                          vehicleTotal:
                            type: number
                            nullable: true
                          vehicleOutOfService:
                            type: number
                            nullable: true
                          vehicleOosRate:
                            type: number
                            nullable: true
                        required:
                        - driverTotal
                        - driverOutOfService
                        - driverOosRate
                        - vehicleTotal
                        - vehicleOutOfService
                        - vehicleOosRate
                        additionalProperties: false
                        nullable: true
                      basics:
                        type: array
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                              nullable: true
                            measureValue:
                              type: number
                              nullable: true
                            percentile:
                              type: string
                              nullable: true
                            violationThreshold:
                              type: number
                              nullable: true
                            exceededInterventionThreshold:
                              type: boolean
                              nullable: true
                            totalViolations:
                              type: number
                              nullable: true
                            totalInspectionsWithViolation:
                              type: number
                              nullable: true
                            runDate:
                              type: string
                              nullable: true
                          required:
                          - category
                          - measureValue
                          - percentile
                          - violationThreshold
                          - exceededInterventionThreshold
                          - totalViolations
                          - totalInspectionsWithViolation
                          - runDate
                          additionalProperties: false
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            dotNumber:
                              type: number
                              nullable: true
                            legalName:
                              type: string
                              nullable: true
                            dbaName:
                              type: string
                              nullable: true
                            physicalState:
                              type: string
                              nullable: true
                          required:
                          - dotNumber
                          - legalName
                          - dbaName
                          - physicalState
                          additionalProperties: false
                      source:
                        $ref: '#/components/schemas/Source'
                      note:
                        type: string
                    required:
                    - mode
                    - query
                    - found
                    - carrier
                    - crashes
                    - inspections
                    - basics
                    - matches
                    - source
                    - note
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: gov.carrier-safety
      x-2s-version: null
      x-2s-price:
        usd: 0.0045
      x-2s-accepts:
      - x402
      x-2s-response-shape: legacy
