      - $ref: '#/components/parameters/TrialMode'
  /api/gov/congress-amendment:
    get:
      tags:
      - gov
      summary: Look up or list US Congressional amendments via Congress.gov
      description: 'Look up or list US Congressional amendments via Congress.gov. Pass congress + type + number to fetch a single amendment with full sponsor + action history. Or filter list by congress + type + date range. Amendment types: hamdt=House Amendment, samdt=Senate Amendment, suamdt=Senate Unprinted Amendment.'
      operationId: gov_congress-amendment
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [amendment] (lookup mode, total 1) or the amendment list (list mode, total = upstream match count); meta.mode flags which.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            congress:
                              type: number
                              nullable: true
                            type:
                              type: string
                              nullable: true
                              description: HAMDT | SAMDT | SUAMDT.
                            number:
                              type: string
                              nullable: true
                            description:
                              type: string
                              nullable: true
                            purpose:
                              type: string
                              nullable: true
                            latestAction:
                              type: object
                              additionalProperties: {}
                              nullable: true
                              description: Upstream pass-through, e.g. { actionDate, text }.
                            updateDate:
                              type: string
                              nullable: true
                            apiUrl:
                              type: string
                              nullable: true
                              description: Congress.gov API URL for the amendment.
                          additionalProperties: {}
                          description: List mode emits this trimmed shape; lookup mode passes the full raw Congress.gov amendment detail through (extra fields, full sponsor + action history).
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                            - lookup
                            - list
                        required:
                        - mode
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
