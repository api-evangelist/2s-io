      - $ref: '#/components/parameters/TrialMode'
  /api/vehicle/investigations:
    get:
      tags:
      - Vehicle
      summary: Chronological feed of NHTSA ODI (Office of Defects
      description: 'Chronological feed of NHTSA ODI (Office of Defects Investigation) investigations, newest first. Returns preliminary evaluations (PE), engineering analyses (EA), defect petitions (DP), and recall queries (RQ) — each with NHTSA ID, type code, open/close dates, status, subject, and full description (HTML stripped + raw). Useful for tracking what NHTSA is currently investigating (Tesla FSD, autonomous-vehicle crashes, Rivian suspension, etc.). NOTE: NHTSA''s endpoint does NOT support make/model/year filtering — use vehicle.recalls or vehicle.complaints for vehicle-scoped lookups. Public-domain US government records.'
      operationId: vehicle_investigations
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = chronological feed of NHTSA ODI investigations (total = all records upstream; paginate via meta.nextOffset).'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            nhtsaId:
                              type: string
                            investigationNumber:
                              type: string
                            investigationType:
                              type: string
                            issueYear:
                              type: string
                            openDate:
                              type: string
                              nullable: true
                            latestActivityDate:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
                            subject:
                              type: string
                            description:
                              type: string
                            descriptionHtml:
                              type: string
                          required:
                          - id
                          - nhtsaId
                          - investigationNumber
                          - investigationType
                          - issueYear
                          - openDate
                          - latestActivityDate
                          - status
                          - subject
                          - description
                          - descriptionHtml
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          query:
                            type: object
                            properties:
                              limit:
                                type: integer
                              offset:
                                type: integer
                              status:
                                type: string
                                nullable: true
                            required:
                            - limit
                            - offset
                            - status
                            additionalProperties: false
                          nextOffset:
                            type: integer
                            nullable: true
                          previousOffset:
                            type: integer
                            nullable: true
                        required:
                        - query
                        - nextOffset
                        - previousOffset
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: vehicle.investigations
      x-2s-version: null
      x-2s-price:
        usd: 0.006
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.006000'
        protocols:
        - x402: {}
      parameters:
      - name: limit
        in: query
        required: false
        description: Max records to return (1-100). Default 25.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        required: false
        description: Offset into the chronological feed for pagination. Default 0.
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: status
        in: query
        required: false
        description: 'Filter by status: "O" (open), "C" (closed). Omit for all.'
        schema:
          type: string
          enum:
          - O
          - C
      - $ref: '#/components/parameters/TrialMode'
  /api/vehicle/manufacturers:
    get:
      tags:
      - Vehicle
      summary: Paginated list of every motor vehicle manufacturer NHTSA
      description: Paginated list of every motor vehicle manufacturer NHTSA tracks via vPIC. Each record includes the canonical Mfr_ID, full legal name, common short name (e.g., "Honda"), country, and the list of vehicle types the manufacturer produces (Passenger Car, Truck, Motorcycle, Bus, MPV, etc.). Pass the optional `manufacturer` param to substring-search Mfr_Name. 100 records per page. Backed by NHTSA.gov; data is public-domain US government records.
      operationId: vehicle_manufacturers
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = manufacturer directory page (100 per page) with canonical NHTSA IDs. total is null — vPIC does not report an overall count; request the next page until items is empty.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            mfrId:
                              type: integer
                            mfrName:
                              type: string
                            commonName:
                              type: string
                              nullable: true
                            country:
                              type: string
                              nullable: true
                            vehicleTypes:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  isPrimary:
                                    type: boolean
                                required:
                                - name
                                - isPrimary
                                additionalProperties: false
                          required:
                          - mfrId
                          - mfrName
                          - commonName
                          - country
                          - vehicleTypes
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          query:
                            type: object
                            properties:
                              page:
                                type: integer
                              manufacturer:
                                type: string
                                nullable: true
                            required:
                            - page
                            - manufacturer
                            additionalProperties: false
                        required:
                        - query
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: vehicle.manufacturers
      x-2s-version: null
      x-2s-price:
        usd: 0.006
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
