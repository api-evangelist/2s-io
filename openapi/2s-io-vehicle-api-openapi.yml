openapi: 3.2.0
info:
  title: 2s — the (most) everything Vehicle API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Vehicle
paths:
  /api/vehicle/canadian-specs:
    get:
      tags:
      - Vehicle
      summary: Canadian-market vehicle dimensions and weights from NHTSA
      description: Canadian-market vehicle dimensions and weights from NHTSA vPIC's Canadian Vehicle Specifications dataset. Pass year + make (required) and optional model to narrow. Returns one entry per matching trim with labeled dimensions — overall length/width/height (cm), wheelbase (cm), curb weight (kg), front/rear track width, interior head/leg/shoulder/hip room, and weight distribution — plus the full raw spec map. Authoritative measured specs (the SAE dimension codes), not estimates. Keyless, public-domain; covers model years 1971+.
      operationId: vehicle_canadian-specs
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = matching vehicles (labeled + raw specs); meta.total = count.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            make:
                              type: string
                              nullable: true
                            model:
                              type: string
                              nullable: true
                            specs:
                              type: object
                              additionalProperties:
                                type: string
                            labeled:
                              type: array
                              items:
                                type: object
                                properties:
                                  code:
                                    type: string
                                  label:
                                    type: string
                                  value:
                                    type: string
                                required:
                                - code
                                - label
                                - value
                                additionalProperties: false
                          required:
                          - make
                          - model
                          - specs
                          - labeled
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          query:
                            type: object
                            properties:
                              year:
                                type: integer
                              make:
                                type: string
                              model:
                                type: string
                                nullable: true
                            required:
                            - year
                            - make
                            - model
                            additionalProperties: false
                          total:
                            type: integer
                        required:
                        - query
                        - total
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: vehicle.canadian-specs
      x-2s-version: null
      x-2s-price:
        usd: 0.0036
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.003600'
        protocols:
        - x402: {}
      parameters:
      - name: year
        in: query
        required: true
        description: Four-digit calendar year.
        schema:
          type: integer
          minimum: 1971
          maximum: 2100
      - name: make
        in: query
        required: true
        description: Make.
        schema:
          type: string
          minLength: 1
          maxLength: 40
      - name: model
        in: query
        required: false
        description: Model.
        schema:
          type: string
          minLength: 1
          maxLength: 60
      - $ref: '#/components/parameters/TrialMode'
  /api/vehicle/complaints:
    get:
      tags:
      - Vehicle
      summary: NHTSA consumer complaints for a US vehicle by (make, model
      description: NHTSA consumer complaints for a US vehicle by (make, model, modelYear). Returns the top N records (newest-filed first) with ODI number, affected component, plain-English summary, crash/fire flags, injury and death counts, partial VIN, and incident + filing dates. Backed by NHTSA's public complaints database; data is public-domain US government records.
      operationId: vehicle_complaints
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = NHTSA consumer-complaint records for the queried vehicle, newest first (total = all matching complaints upstream). To go straight from a VIN to its complaints (and recalls), see /api/vehicle/profile.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            odiNumber:
                              type: integer
                            manufacturer:
                              type: string
                              nullable: true
                            components:
                              type: string
                              nullable: true
                            summary:
                              type: string
                              nullable: true
                            crash:
                              type: boolean
                            fire:
                              type: boolean
                            numberOfInjuries:
                              type: integer
                            numberOfDeaths:
                              type: integer
                            vin:
                              type: string
                              nullable: true
                            dateOfIncident:
                              type: string
                              nullable: true
                            dateComplaintFiled:
                              type: string
                              nullable: true
                          required:
                          - odiNumber
                          - manufacturer
                          - components
                          - summary
                          - crash
                          - fire
                          - numberOfInjuries
                          - numberOfDeaths
                          - vin
                          - dateOfIncident
                          - dateComplaintFiled
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          query:
                            type: object
                            properties:
                              make:
                                type: string
                              model:
                                type: string
                              modelYear:
                                type: integer
                              limit:
                                type: integer
                            required:
                            - make
                            - model
                            - modelYear
                            - limit
                            additionalProperties: false
                        required:
                        - query
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: vehicle.complaints
      x-2s-version: null
      x-2s-price:
        usd: 0.006
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.006000'
        protocols:
        - x402: {}
      parameters:
      - name: make
        in: query
        required: true
        description: 'Vehicle make. Examples: "Honda", "Tesla", "Ford".'
        schema:
          type: string
          minLength: 2
          maxLength: 40
      - name: model
        in: query
        required: true
        description: 'Vehicle model. Examples: "Accord", "Model 3", "F-150".'
        schema:
          type: string
          minLength: 1
          maxLength: 40
      - name: modelYear
        in: query
        required: true
        description: 4-digit model year.
        schema:
          type: integer
          minimum: 1949
          maximum: 2099
      - name: limit
        in: query
        required: false
        description: Max records to return, newest-filed first (1-100). Default 25.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - $ref: '#/components/parameters/TrialMode'
  /api/vehicle/decode-wmi:
    get:
      tags:
      - Vehicle
      summary: Decode a 3-character World Manufacturer Identifier (the
      description: Decode a 3-character World Manufacturer Identifier (the first three characters of a VIN) to the assigning manufacturer. Returns full manufacturer legal name, common short name, make, vehicle type, and the date NHTSA published the assignment. Useful for partial-VIN analysis — crash reports, damaged-vehicle photos, fleet records — where only the WMI is recoverable. Backed by NHTSA.gov vPIC; data is public-domain US government records.
      operationId: vehicle_decode-wmi
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = single manufacturer record decoded from a 3-char WMI prefix.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            wmi:
                              type: string
                            manufacturerName:
                              type: string
                              nullable: true
                            commonName:
                              type: string
                              nullable: true
                            make:
                              type: string
                              nullable: true
                            vehicleType:
                              type: string
                              nullable: true
                            dateAvailableToPublic:
                              type: string
                              nullable: true
                          required:
                          - wmi
                          - manufacturerName
                          - commonName
                          - make
                          - vehicleType
                          - dateAvailableToPublic
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: vehicle.decode-wmi
      x-2s-version: null
      x-2s-price:
        usd: 0.006
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.006000'
        protocols:
        - x402: {}
      parameters:
      - name: wmi
        in: query
        required: true
        description: '3-character WMI (the first 3 chars of a VIN). Case-insensitive. Examples: 1HG (American Honda), 5YJ (Tesla US), WBA (BMW).'
        schema:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-HJ-NPR-Z0-9]{3}$
      - $ref: '#/components/parameters/TrialMode'
  /api/vehicle/fuel-economy:
    get:
      tags:
      - Vehicle
      summary: Official US EPA/DOE fuel-economy, fuel-cost, and emissions
      description: 'Official US EPA/DOE fuel-economy, fuel-cost, and emissions data for a vehicle by year + make + model. Because a model-year often has several powertrain configurations (engine/transmission), this returns one entry per configuration, each with: MPG city/highway/combined (or MPGe for EVs), CO2 tailpipe grams/mile, estimated annual fuel cost (USD), annual petroleum use (barrels), EPA greenhouse-gas score (1-10), 5-year savings vs the average new vehicle, plus transmission, drivetrain, cylinders, displacement, fuel type, EPA size class, and electric range for EV/PHEV. Authoritative EPA test figures — the real ratings an agent should not estimate. Keyless, public-domain (FuelEconomy.gov), covers model years 1984+.'
      operationId: vehicle_fuel-economy
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = powertrain configurations (one per engine/transmission); meta.total = count.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            description:
                              type: string
                            year:
                              type: integer
                              nullable: true
                            make:
                              type: string
                              nullable: true
                            model:
                              type: string
                              nullable: true
                            vehicleClass:
                              type: string
                              nullable: true
                            transmission:
                              type: string
                              nullable: true
                            drive:
                              type: string
                              nullable: true
                            cylinders:
                              type: number
                              nullable: true
                            displacementL:
                              type: number
                              nullable: true
                            fuelType:
                              type: string
                              nullable: true
                            mpgCity:
                              type: number
                              nullable: true
                            mpgHighway:
                              type: number
                              nullable: true
                            mpgCombined:
                              type: number
                              nullable: true
                            co2GramsPerMile:
                              type: number
                              nullable: true
                            annualFuelCostUSD:
                              type: number
                              nullable: true
                            annualPetroleumBarrels:
                              type: number
                              nullable: true
                            ghgScore:
                              type: number
                              nullable: true
                            fiveYearSavingsVsAvgUSD:
                              type: number
                              nullable: true
                            electricRangeMi:
                              type: number
                              nullable: true
                          required:
                          - id
                          - description
                          - year
                          - make
                          - model
                          - vehicleClass
                          - transmission
                          - drive
                          - cylinders
                          - displacementL
                          - fuelType
                          - mpgCity
                          - mpgHighway
                          - mpgCombined
                          - co2GramsPerMile
                          - annualFuelCostUSD
                          - annualPetroleumBarrels
                          - ghgScore
                          - fiveYearSavingsVsAvgUSD
                          - electricRangeMi
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          query:
                            type: object
                            properties:
                              year:
                                type: integer
                              make:
                                type: string
                              model:
                                type: string
                            required:
                            - year
                            - make
                            - model
                            additionalProperties: false
                          total:
                            type: integer
                        required:
                        - query
                        - total
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: vehicle.fuel-economy
      x-2s-version: null
      x-2s-price:
        usd: 0.0045
      x-2s-accepts:
