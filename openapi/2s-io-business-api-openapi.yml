                              type: string
                              nullable: true
                            legalName:
                              type: string
                              nullable: true
                            tradeName:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
                            statusReason:
                              type: string
                              nullable: true
                            startDate:
                              type: string
                              nullable: true
                            legalNature:
                              type: string
                              nullable: true
                            size:
                              type: string
                              nullable: true
