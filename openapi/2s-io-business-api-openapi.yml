          minLength: 2
          maxLength: 200
      - name: country
        in: query
        required: false
        description: Optional ISO-2 country of the entity HQ to narrow the match (e.g., "US", "DE", "GB").
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: limit
        in: query
        required: false
        description: Max ranked candidates to return (1-25). Default 5.
        schema:
