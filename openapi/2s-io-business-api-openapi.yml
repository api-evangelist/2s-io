                              additionalProperties: false
                          required:
                          - state
                          - entityId
                          - accountNumber
                          - name
                          - status
                          - type
                          - jurisdiction
                          - registrationDate
                          - mailingAddress
                          - ownership
                          - officers
                          - registeredAgent
                          - filings
                          - counts
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          state:
                            type: string
                          resolvedFrom:
                            type: string
                            enum:
                            - entityId
                            - accountNumber
                            - name
                          candidateCount:
                            type: integer
                            nullable: true
                          partial:
                            type: array
                            items:
                              type: string
                        required:
                        - state
                        - resolvedFrom
                        - candidateCount
                        - partial
                        additionalProperties: false
                    required:
