  /api/business/entity-match:
    get:
      tags:
      - Business
      summary: 'Fuzzy entity resolution: resolve a messy, free-text company'
      description: 'Fuzzy entity resolution: resolve a messy, free-text company name to its canonical GLEIF Legal Entity Identifier (LEI) with a 0-1 similarity score and a high/medium/low confidence label. Tolerant of legal-suffix noise (Inc/Ltd/GmbH/S.A.), word order, ampersands, punctuation, and former/alternate names (e.g. ''Apple Computer Inc'' resolves to Apple Inc. via GLEIF''s recorded other-names). Returns the top candidates ranked by score plus a single bestMatch (null when nothing clears medium confidence — so a low-confidence top hit is never silently treated as a match, which is the safe default for KYB). The record-linkage complement to business.lei (name search). Optional country (ISO-2) narrows to a jurisdiction. Backed by GLEIF Golden Copy (~2.6M entities, CC0).'
      operationId: business_entity-match
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = candidate LEI records ranked by fuzzy score (desc); total = size of the FTS candidate pool; meta.bestMatch = the single confident resolution (or null); meta.query echoes the search.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            lei:
                              type: string
                            legalName:
                              type: string
                              nullable: true
                            otherName:
                              type: string
                              nullable: true
                            score:
                              type: number
                            confidence:
                              type: string
                              enum:
                              - high
                              - medium
                              - low
                            jurisdiction:
                              type: string
                              nullable: true
                            entityStatus:
                              type: string
                              nullable: true
                            registrationStatus:
                              type: string
                              nullable: true
                            headquarters:
                              type: object
                              properties:
                                city:
                                  type: string
                                  nullable: true
                                region:
                                  type: string
                                  nullable: true
                                country:
                                  type: string
                                  nullable: true
                              required:
                              - city
                              - region
                              - country
                              additionalProperties: false
                          required:
                          - lei
                          - legalName
                          - otherName
                          - score
                          - confidence
                          - jurisdiction
                          - entityStatus
                          - registrationStatus
                          - headquarters
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          query:
                            type: object
                            properties:
                              name:
                                type: string
                              country:
                                type: string
                                nullable: true
                              limit:
                                type: integer
                            required:
                            - name
                            - country
                            - limit
                            additionalProperties: false
                          bestMatch:
                            type: object
                            properties:
                              lei:
                                type: string
                              legalName:
                                type: string
                                nullable: true
                              score:
                                type: number
                              confidence:
                                type: string
                                enum:
                                - high
                                - medium
                                - low
                            required:
                            - lei
                            - legalName
                            - score
                            - confidence
                            additionalProperties: false
                            nullable: true
                        required:
                        - query
                        - bestMatch
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: business.entity-match
      x-2s-version: null
      x-2s-price:
        usd: 0.0072
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.007200'
        protocols:
        - x402: {}
      parameters:
      - name: name
        in: query
        required: true
        description: 'Free-text company / legal-entity name to resolve. Messy input is fine: "Apple Computer Inc.", "jp morgan chase & co".'
        schema:
