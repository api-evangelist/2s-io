                              properties:
                                womanOwned:
                                  type: boolean
                                  nullable: true
                                veteranOwned:
                                  type: boolean
                                  nullable: true
                                minorityOwned:
                                  type: boolean
                                  nullable: true
                                disabilityOwned:
                                  type: boolean
                                  nullable: true
                                lgbtqiOwned:
                                  type: boolean
                                  nullable: true
                              required:
                              - womanOwned
                              - veteranOwned
                              - minorityOwned
                              - disabilityOwned
                              - lgbtqiOwned
                              additionalProperties: false
                            officers:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    nullable: true
                                  firstName:
                                    type: string
                                    nullable: true
                                  lastName:
                                    type: string
                                    nullable: true
                                  businessAddress:
                                    type: string
                                    nullable: true
                                  residenceAddress:
                                    type: string
                                    nullable: true
                                required:
                                - name
                                - firstName
                                - lastName
                                - businessAddress
                                - residenceAddress
                                additionalProperties: false
                            registeredAgent:
                              type: object
                              properties:
                                name:
                                  type: string
                                  nullable: true
                                type:
                                  type: string
                                  nullable: true
                                phone:
                                  type: string
                                  nullable: true
                                email:
                                  type: string
                                  nullable: true
                                address:
                                  type: string
                                  nullable: true
                              required:
                              - name
                              - type
                              - phone
                              - email
                              - address
                              additionalProperties: false
                              nullable: true
                            filings:
                              type: array
                              items:
                                type: object
                                properties:
                                  date:
                                    type: string
                                    nullable: true
                                  type:
                                    type: string
                                    nullable: true
                                  filingType:
                                    type: string
                                    nullable: true
                                  reportYear:
                                    type: string
                                    nullable: true
                                required:
                                - date
                                - type
                                - filingType
                                - reportYear
                                additionalProperties: false
                            counts:
                              type: object
                              properties:
                                officers:
                                  type: integer
                                filings:
                                  type: integer
