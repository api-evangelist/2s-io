  /api/business/entity-screen:
    get:
      tags:
      - Business
      summary: 'KYC in one call: look up a business in a US state registry'
      description: 'KYC in one call: look up a business in a US state registry (NY, CO, CT) AND screen it against the OFAC sanctions list. Give a state and a name (or exact entityId). Returns the matched registered entities (id, type, status, jurisdiction, address, registered agent) and, for each, a sanctions screen of the entity name AND its registered agent against OFAC SDN — with fuzzy-match confidence and a flagged boolean. Counterparty due-diligence, vendor onboarding, AML. Composition of /api/business/sos-search + /api/law/sanctions-check (each section reports found/error independently). Note: sanctions screening is name-based and probabilistic — review flagged matches manually.'
      operationId: business_entity-screen
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      state:
                        type: string
                      count:
                        type: number
                      entities:
                        type: array
                        items:
                          type: object
                          properties:
                            entity:
                              type: object
                              additionalProperties: {}
                            sanctions:
                              type: object
                              properties:
                                found:
                                  type: boolean
                                error:
                                  type: string
                                  nullable: true
                                flagged:
                                  type: boolean
                                entityMatchCount:
                                  type: number
                                agentMatchCount:
                                  type: number
                                matches:
                                  type: array
                                  items:
                                    type: object
                                    additionalProperties: {}
                              required:
                              - found
                              - error
                              - flagged
                              - entityMatchCount
                              - agentMatchCount
                              - matches
                              additionalProperties: false
                          required:
                          - entity
                          - sanctions
                          additionalProperties: false
                      sources:
                        type: array
                        items:
                          type: object
                          additionalProperties: {}
                    required:
                    - state
                    - count
                    - entities
                    - sources
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: business.entity-screen
      x-2s-version: null
      x-2s-price:
        usd: 0.0144
      x-2s-accepts:
      - x402
      x-2s-response-shape: legacy
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.014400'
        protocols:
        - x402: {}
      parameters:
      - name: state
        in: query
        required: true
        description: US state — two-letter postal abbreviation (e.g. CA) or full name.
        schema:
          type: string
          enum:
