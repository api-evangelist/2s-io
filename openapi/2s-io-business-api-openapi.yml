  /api/business/entity-profile:
    get:
      tags:
      - Business
      summary: Full business-entity dossier from a state registry - master
      description: 'Full business-entity dossier from a state registry — master record plus officers/principals, registered agent (name, phone, email, address), and filing history — the detail layer that flat registry search omits. v1 state: CT (Connecticut). Resolve by entityId (state registry record id), accountNumber, or name (partial; most recent registration wins). Returns entity status, type, registration date, mailing address, minority/woman/veteran/disability/LGBTQI ownership flags, officers, registered agent, and recent filings. KYB, vendor due-diligence, and counterparty-verification staple, sourced from the official state open-data portal.'
      operationId: business_entity-profile
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [entity dossier] (master + officers + registered agent + filings); total = 1; meta = {state, resolvedFrom, candidateCount, partial}. partial lists any child source that degraded.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            state:
                              type: string
                            entityId:
                              type: string
                              nullable: true
                            accountNumber:
                              type: string
                              nullable: true
                            name:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
                            type:
                              type: string
                              nullable: true
                            jurisdiction:
                              type: string
                              nullable: true
                            registrationDate:
                              type: string
                              nullable: true
                            mailingAddress:
                              type: string
                              nullable: true
                            ownership:
