                              type: number
                              nullable: true
                            primaryActivityCode:
                              type: string
                              nullable: true
                            primaryActivity:
                              type: string
                              nullable: true
                            email:
                              type: string
                              nullable: true
                            phone:
                              type: string
                              nullable: true
                            address:
                              type: object
