        schema:
          type: string
          minLength: 2
          maxLength: 120
      - name: licenseNumber
        in: query
        required: false
        description: License number.
        schema:
          type: string
          minLength: 1
          maxLength: 20
      - name: licenseType
        in: query
        required: false
        description: License type.
        schema:
          type: string
          minLength: 2
          maxLength: 60
      - name: status
        in: query
        required: false
        description: Filter results by status.
        schema:
          type: string
          minLength: 2
          maxLength: 40
      - name: limit
        in: query
        required: false
        description: Maximum number of results to return.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: offset
        in: query
        required: false
