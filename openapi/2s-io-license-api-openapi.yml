          default: 10
      - name: skip
        in: query
        required: false
        description: Skip.
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - $ref: '#/components/parameters/TrialMode'
  /api/license/real-estate:
    get:
      tags:
      - License
      summary: Verify US real-estate licenses (brokers, sales agents
      description: 'Verify US real-estate licenses (brokers, sales agents, broker companies). Currently supported state: TX (Texas Real Estate Commission license holders). Search by name (license holder, partial), licenseNumber (exact), licenseType (partial, e.g. "Broker", "Sales Agent"), status (e.g. "Active"). Each license: type, number, holder name, status, original license date, expiration date, and the related supervising broker (type/number/name) where applicable. Agent/broker due-diligence and KYC. Siblings: /api/license/medical, /api/license/broker, /api/license/trades. Official state open data.'
      operationId: license_real-estate
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = real-estate licenses; total = null (capped state-portal search); meta = {state, query}.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            licenseType:
                              type: string
                              nullable: true
                            licenseNumber:
                              type: string
                              nullable: true
                            name:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
                            originalLicenseDate:
                              type: string
                              nullable: true
                            expires:
                              type: string
                              nullable: true
                            supervisor:
                              type: object
                              properties:
                                type:
                                  type: string
                                  nullable: true
                                number:
                                  type: string
                                  nullable: true
                                name:
                                  type: string
                                  nullable: true
                              required:
                              - type
                              - number
                              - name
                              additionalProperties: false
                              nullable: true
                          required:
                          - licenseType
                          - licenseNumber
                          - name
                          - status
                          - originalLicenseDate
                          - expires
                          - supervisor
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          state:
                            type: string
                          query:
                            type: object
                            properties:
                              name:
                                type: string
                                nullable: true
                              licenseNumber:
                                type: string
                                nullable: true
                              licenseType:
                                type: string
                                nullable: true
                              status:
                                type: string
                                nullable: true
                            required:
                            - name
                            - licenseNumber
                            - licenseType
                            - status
                            additionalProperties: false
                        required:
                        - state
                        - query
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: license.real-estate
      x-2s-version: null
      x-2s-price:
        usd: 0.0072
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.007200'
        protocols:
