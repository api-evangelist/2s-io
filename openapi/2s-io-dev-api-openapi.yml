          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items: {}
                  maxItems: 10000
                  description: Data.
                delimiter:
                  type: string
                  maxLength: 1
                  description: Delimiter.
              required:
              - data
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/dev/json-to-typescript:
    post:
      tags:
      - Dev
      summary: Infer a TypeScript interface from a sample JSON value
      description: Infer a TypeScript interface from a sample JSON value. POST { sample, rootName? }. Handles nested objects, arrays (merged element type), and primitives; merges keys across array elements. Returns a ready-to-paste interface string.
      operationId: dev_json-to-typescript
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [{ typescript }].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            typescript:
                              type: string
                          required:
                          - typescript
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: dev.json-to-typescript
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sample:
                  description: Sample.
                rootName:
                  type: string
                  pattern: ^[A-Za-z_$][\w$]*$
                  maxLength: 60
                  description: Root name.
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/dev/json-to-zod:
    post:
      tags:
      - Dev
      summary: Infer a Zod schema from a sample JSON value
      description: Infer a Zod schema from a sample JSON value. POST { sample, name? }. Handles nested objects, arrays, and primitives, merging keys across array elements. Returns a ready-to-paste `const name = z.object({...})` string.
      operationId: dev_json-to-zod
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [{ zod }].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            zod:
                              type: string
                          required:
                          - zod
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: dev.json-to-zod
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sample:
                  description: Sample.
                name:
                  type: string
                  pattern: ^[A-Za-z_$][\w$]*$
                  maxLength: 60
                  description: Name to search for.
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/dev/jwt-decode:
    post:
      tags:
      - Dev
      summary: Decode a JWT without verifying its signature
      description: Decode a JWT without verifying its signature. POST { token }. Returns the decoded header and payload, plus issuedAt/expiresAt/notBefore as ISO timestamps, and expired / notYetValid flags. Signature is NOT checked — decode/inspection only. For agents reading token claims (scopes, sub, exp) before acting.
      operationId: dev_jwt-decode
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [decoded JWT].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            header:
                              type: object
                              additionalProperties: {}
                              description: Decoded JOSE header (arbitrary fields).
                            payload:
                              type: object
                              additionalProperties: {}
                              description: Decoded claims (arbitrary fields).
                            issuedAt:
                              type: string
                              nullable: true
                              description: iat as ISO 8601; null when absent.
                            expiresAt:
                              type: string
                              nullable: true
                              description: exp as ISO 8601; null when absent.
                            notBefore:
                              type: string
                              nullable: true
                              description: nbf as ISO 8601; null when absent.
                            expired:
                              type: boolean
                              nullable: true
                              description: null when no exp claim.
                            notYetValid:
                              type: boolean
                              nullable: true
                              description: null when no nbf claim.
                            signaturePresent:
                              type: boolean
                            note:
                              type: string
                          required:
                          - header
                          - payload
                          - issuedAt
                          - expiresAt
                          - notBefore
                          - expired
                          - notYetValid
                          - signaturePresent
                          - note
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
