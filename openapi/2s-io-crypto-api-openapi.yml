      summary: Decode an EVM smart contract
      description: 'Decode an EVM smart contract. Pass chain (ethereum, base, polygon, arbitrum, optimism, bsc, avalanche) + address; returns whether the contract is source-verified (Sourcify), its name/compiler/language, whether it is a proxy and its implementation address, and human-readable function and event signatures from the ABI. Optionally pass selector (a 0x 4-byte function selector) to decode what it calls — resolved from the contract''s own ABI when verified, otherwise from the public 4byte directory. Pairs with crypto.tx (which gives a `to` address + calldata): turn an opaque contract + selector into "what is this and what does it do." Free, keyless.'
      operationId: crypto_contract
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items[0] = the contract (verification, ABI signatures, proxy, optional decoded selector).'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            chain:
                              type: string
                            address:
                              type: string
                            verified:
                              type: boolean
                              description: Source-verified on Sourcify.
                            name:
                              type: string
                              nullable: true
                            compiler:
                              type: string
                              nullable: true
                            language:
                              type: string
                              nullable: true
                            isProxy:
                              type: boolean
                            implementation:
                              type: string
                              nullable: true
                              description: Implementation address if a proxy.
                            functionCount:
                              type: integer
                            functions:
                              type: array
                              items:
                                type: string
                              description: Function signatures from the ABI.
                            events:
                              type: array
                              items:
                                type: string
                              description: Event signatures from the ABI.
                            decoded:
                              type: object
                              properties:
                                selector:
                                  type: string
                                signature:
                                  type: string
                                  nullable: true
                                source:
                                  type: string
                              required:
                              - selector
                              - signature
                              - source
                              additionalProperties: false
                              description: Decoded selector (when selector passed).
                          required:
                          - chain
                          - address
                          - verified
                          - name
                          - compiler
                          - language
                          - isProxy
                          - implementation
                          - functionCount
                          - functions
                          - events
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          verified:
                            type: boolean
                        required:
                        - verified
