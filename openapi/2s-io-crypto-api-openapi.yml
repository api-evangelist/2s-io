  /api/crypto/kimchi-premium:
    get:
      tags:
      - Crypto
      summary: The "kimchi premium" - how much higher a crypto asset
      description: The "kimchi premium" — how much higher a crypto asset trades on Korean exchanges (Upbit, KRW) than its global USD price, as a percent. Computed as (Upbit KRW price / (global USD price × USD/KRW)) − 1. Pass symbol = ticker(s), comma-separated up to 10 (default BTC); supported majors include BTC, ETH, XRP, SOL, DOGE, ADA, TRX and more. Returns per symbol { krwPrice, usdPrice, usdKrw, globalUsdInKrw, premiumPct }. Per-symbol resilient (one unlisted symbol does not fail the rest); unresolved symbols are reported in meta.errors. Live blend of Upbit (KRW price) + CoinGecko (global USD) + ECB/Frankfurter (USD/KRW FX).
      operationId: crypto_kimchi-premium
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = per-symbol kimchi-premium rows; total = rows returned; meta.errors lists symbols that could not be resolved.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            symbol:
                              type: string
                            krwPrice:
                              type: number
                              description: Upbit KRW spot price.
                            usdPrice:
                              type: number
                              description: Global USD spot price (CoinGecko).
                            usdKrw:
                              type: number
                              description: USD/KRW reference FX rate (ECB).
                            globalUsdInKrw:
                              type: number
                              description: usdPrice * usdKrw — the global price expressed in KRW.
                            premiumPct:
                              type: number
                              description: (krwPrice / globalUsdInKrw - 1) * 100. Positive = Korea trades richer.
                          required:
                          - symbol
                          - krwPrice
                          - usdPrice
                          - usdKrw
                          - globalUsdInKrw
                          - premiumPct
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          usdKrw:
                            type: number
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                symbol:
                                  type: string
                                error:
                                  type: string
                              required:
                              - symbol
                              - error
                              additionalProperties: false
                          asOf:
                            type: string
                        required:
                        - usdKrw
                        - errors
                        - asOf
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
