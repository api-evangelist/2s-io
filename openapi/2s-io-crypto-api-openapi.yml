  /api/crypto/tx:
    get:
      tags:
      - Crypto
      summary: Live EVM transaction status and receipt lookup
      description: 'Live EVM transaction status and receipt lookup. Give a transaction hash + chain and get back whether it mined successfully, reverted, or is still pending in the mempool, plus block number, confirmations, timestamp, sender and recipient, value transferred (native unit), gas used, effective gas price, total fee paid, any contract created, and event-log count. Chains: base, ethereum, polygon, arbitrum, optimism. Real-time post-training chain state — use it to confirm a payment settled, detect a reverted transaction, or wait for confirmations before acting. Unknown hash returns 404. Sibling of /api/crypto/gas-oracle (fees) and /api/crypto/address-validate (format).'
      operationId: crypto_tx
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [the transaction] with status (success | reverted | pending), block, confirmations, from/to, value (native), gasUsed, effectiveGasPriceGwei, feeNative, contractAddress, logCount; total = 1. 404 if the hash is unknown on that chain.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            chain:
                              type: object
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                chainId:
                                  type: number
                                nativeSymbol:
                                  type: string
                              required:
                              - key
                              - name
                              - chainId
                              - nativeSymbol
                              additionalProperties: false
                            hash:
                              type: string
                            status:
                              type: string
                              enum:
                              - success
                              - reverted
                              - pending
                            mined:
                              type: boolean
                            blockNumber:
                              type: number
                              nullable: true
                              description: Null while pending.
                            blockTimestamp:
                              type: number
                              nullable: true
                              description: Block time, Unix ms; null while pending.
                            confirmations:
                              type: number
                              description: Blocks on top of the tx block, inclusive of its own; 0 while pending.
                            from:
                              type: string
                            to:
                              type: string
                              nullable: true
                              description: Null for contract-creation transactions.
                            contractAddress:
                              type: string
                              nullable: true
                              description: Contract created, if this was a contract-creation tx.
                            nonce:
                              type: number
                            valueNative:
                              type: string
                              description: Value transferred in the chain native unit (decimal string).
                            valueWei:
                              type: string
                            gasUsed:
                              type: string
                              nullable: true
                              description: Gas units consumed; null while pending.
                            effectiveGasPriceGwei:
                              type: string
                              nullable: true
                            feeNative:
                              type: string
                              nullable: true
                              description: Total fee = gasUsed × effectiveGasPrice, native unit; null while pending.
                            logCount:
                              type: number
                              nullable: true
                              description: Event logs emitted; null while pending.
                          required:
                          - chain
                          - hash
                          - status
                          - mined
                          - blockNumber
                          - blockTimestamp
                          - confirmations
                          - from
                          - to
                          - contractAddress
                          - nonce
                          - valueNative
                          - valueWei
                          - gasUsed
                          - effectiveGasPriceGwei
                          - feeNative
                          - logCount
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
