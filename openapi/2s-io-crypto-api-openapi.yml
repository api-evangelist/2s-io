openapi: 3.2.0
info:
  title: 2s — the (most) everything Crypto API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Crypto
paths:
  /api/crypto/address-history:
    get:
      tags:
      - Crypto
      summary: Transaction history for an Ethereum address (via Etherscan V2)
      description: 'Transaction history for an Ethereum address (via Etherscan V2). Returns normal transactions newest-first: hash, block, timestamp, from/to, value (wei + ETH), gas used, gas price, decoded method id + function name, error flag, and any contract created. Paginate with page + offset; bound with startBlock/endBlock. Defaults to Ethereum mainnet; other EVM chains are reachable by chainId where upstream coverage allows. Net-new vs crypto.tx (single-hash receipt).'
      operationId: crypto_address-history
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = transactions.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            hash:
                              nullable: true
                            blockNumber:
                              type: number
                              nullable: true
                            timestamp:
                              type: string
                              nullable: true
                            from:
                              nullable: true
                            to:
                              nullable: true
                            valueWei:
                              type: string
                              nullable: true
                            valueEth:
                              type: number
                              nullable: true
                            gasUsed:
                              type: number
                              nullable: true
                            gasPriceWei:
                              type: string
                              nullable: true
                            methodId:
                              nullable: true
                            functionName:
                              nullable: true
                            isError:
                              type: boolean
                            contractAddress:
                              type: string
                              nullable: true
                          required:
                          - blockNumber
                          - timestamp
                          - valueWei
                          - valueEth
                          - gasUsed
                          - gasPriceWei
                          - isError
                          - contractAddress
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: crypto.address-history
      x-2s-version: null
      x-2s-price:
        usd: 0.0036
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.003600'
        protocols:
        - x402: {}
      parameters:
      - name: chainId
        in: query
        required: false
        description: EVM chain id; defaults to 1 (Ethereum). Other chains (8453 Base, 137 Polygon, 42161 Arbitrum…) require upstream multichain coverage.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: address
        in: query
        required: true
        description: Street address or full address string.
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - name: page
        in: query
        required: false
        description: Page number (1-based) for paginated results.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        required: false
        description: Number of results to skip before returning (pagination offset).
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        required: false
        description: Field to sort results by.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: startBlock
        in: query
        required: false
        description: Start block.
        schema:
          type: integer
          minimum: 0
      - name: endBlock
        in: query
        required: false
        description: End block.
        schema:
          type: integer
          minimum: 0
      - $ref: '#/components/parameters/TrialMode'
  /api/crypto/address-safety:
    get:
      tags:
      - Crypto
      summary: Malicious-wallet screen (via GoPlus, free/keyless)
      description: Malicious-wallet screen (via GoPlus, free/keyless). For any EVM address returns risk flags — cybercrime, money laundering, financial crime, darkweb, phishing, stealing/blackmail, fake KYC, mixer, sanctioned, honeypot-related, blacklist doubt and more — plus an overall malicious verdict and hit count. Counterparty risk check before interacting with an address.
      operationId: crypto_address-safety
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [address safety report].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            chainId:
                              type: string
                            address:
                              type: string
                            malicious:
                              type: boolean
                            hitCount:
                              type: number
                            numberOfMaliciousContractsCreated:
                              type: number
                              nullable: true
                            dataSource:
                              nullable: true
                            flags:
                              type: object
                              additionalProperties:
                                type: boolean
                                nullable: true
                          required:
                          - chainId
                          - address
                          - malicious
                          - hitCount
                          - numberOfMaliciousContractsCreated
                          - flags
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: crypto.address-safety
      x-2s-version: null
      x-2s-price:
        usd: 0.004998
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.004998'
        protocols:
        - x402: {}
      parameters:
      - name: chainId
        in: query
        required: true
        description: EVM chain id, e.g. 1, 56, 137, 8453.
        schema:
          type: string
          minLength: 1
          maxLength: 20
      - name: address
        in: query
        required: true
        description: Street address or full address string.
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - $ref: '#/components/parameters/TrialMode'
  /api/crypto/address-screen:
    get:
      tags:
      - Crypto
      summary: Sanctions-screen a crypto wallet address against the US
      description: Sanctions-screen a crypto wallet address against the US Treasury OFAC SDN list's published Digital Currency Addresses (BTC/ETH/USDT/XMR and more). Exact match — returns whether the address is sanctioned, and for any hit the listed entity name, OFAC programs, source id, and the currency the address was listed under. Compliance check before transacting. Distinct from crypto.address-safety (GoPlus behavioral risk) — this is regulatory sanctions.
      operationId: crypto_address-screen
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [screen result]; sanctioned=true means the address is OFAC-listed.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            sanctioned:
                              type: boolean
                            matchCount:
                              type: number
                            matches:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  sourceList:
                                    type: string
                                  sourceId:
                                    type: string
                                    nullable: true
                                  entityType:
                                    type: string
                                    nullable: true
                                  programs:
                                    type: array
                                    items:
                                      type: string
                                  currencies:
                                    type: array
                                    items:
                                      type: string
                                required:
                                - name
                                - sourceList
                                - sourceId
                                - entityType
                                - programs
                                - currencies
                                additionalProperties: false
                          required:
                          - address
                          - sanctioned
                          - matchCount
                          - matches
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: crypto.address-screen
      x-2s-version: null
      x-2s-price:
        usd: 0.004998
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.004998'
        protocols:
        - x402: {}
      parameters:
      - name: address
        in: query
        required: true
        description: Wallet address (any chain). Case-insensitive.
        schema:
          type: string
          minLength: 8
          maxLength: 120
      - $ref: '#/components/parameters/TrialMode'
  /api/crypto/address-validate:
    get:
      tags:
      - Crypto
      summary: Validate a cryptocurrency address with full checksum
      description: 'Validate a cryptocurrency address with full checksum verification (not just regex). Returns {chain, address, valid, canonical, format, reason}. Chains: btc (P2PKH, P2SH, Bech32 SegWit v0, Taproot Bech32m), eth (full EIP-55 checksum; non-checksummed flagged), sol (Ed25519 32-byte Base58), ltc (Base58Check L.../M.../3... + ltc1 Bech32), trx (T-prefix Base58Check 0x41), xrp (r-prefix custom Base58), bch (legacy Base58Check + bitcoincash:q... CashAddr). Catches typos via cryptographic checksum; canonical field returns the checksummed/lowercased form.'
      operationId: crypto_address-validate
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [validation result] (chain, address, valid, canonical, format, reason); total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            chain:
                              type: string
                              enum:
                              - btc
                              - eth
                              - sol
                              - ltc
                              - trx
                              - xrp
                              - bch
                            address:
                              type: string
                              description: The address as submitted.
                            valid:
                              type: boolean
                            canonical:
                              type: string
                              nullable: true
                              description: Canonical checksummed/normalized form when valid.
                            format:
                              type: string
                              nullable: true
                              description: Sub-format when meaningful, e.g. 'p2pkh', 'eip-55', 'bech32-taproot', 'ed25519'.
                            reason:
                              type: string
                              nullable: true
                              description: Failure reason when valid=false.
                          required:
                          - chain
                          - address
                          - valid
                          - canonical
                          - format
                          - reason
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: crypto.address-validate
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      parameters:
      - name: chain
        in: query
        required: true
        description: Chain.
        schema:
          type: string
          enum:
          - btc
          - eth
          - sol
          - ltc
          - trx
          - xrp
          - bch
      - name: address
        in: query
        required: true
        description: Street address or full address string.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: '#/components/parameters/TrialMode'
  /api/crypto/balances:
    get:
      tags:
      - Crypto
      summary: Live native + ERC-20 token balances for an EVM address
      description: Live native + ERC-20 token balances for an EVM address (Base, Ethereum, Polygon, Arbitrum, Optimism; keyless). Returns the native-coin balance and, for any ERC-20 contract addresses you pass, the symbol, decimals, raw and human-formatted balance — fetched in one multicall. For wallet dashboards, treasury checks, and agent payment/settlement flows.
      operationId: crypto_balances
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [one balances object].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            chain:
                              type: string
                            address:
                              type: string
                            native:
                              type: object
                              properties:
                                symbol:
                                  type: string
                                raw:
                                  type: string
                                balance:
                                  type: string
                              required:
                              - symbol
                              - raw
                              - balance
                              additionalProperties: false
                            tokens:
                              type: array
                              items:
                                type: object
                                properties:
                                  contract:
                                    type: string
                                  symbol:
                                    nullable: true
                                  decimals:
                                    type: number
                                  raw:
                                    type: string
                                    nullable: true
                                  balance:
                                    type: string
                                    nullable: true
                                required:
                                - contract
                                - decimals
                                - raw
                                - balance
                                additionalProperties: false
                          required:
                          - chain
                          - address
                          - native
                          - tokens
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: crypto.balances
      x-2s-version: null
      x-2s-price:
        usd: 0.0036
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.003600'
        protocols:
        - x402: {}
      parameters:
      - name: address
        in: query
        required: true
        description: EVM address to read.
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - name: chain
        in: query
        required: false
        description: Default base.
        schema:
          type: string
          enum:
          - base
          - ethereum
          - polygon
          - arbitrum
          - optimism
      - name: tokens
        in: query
        required: false
        description: Comma-separated ERC-20 contract addresses (max 20).
        schema:
          type: string
          maxLength: 900
      - $ref: '#/components/parameters/TrialMode'
  /api/crypto/btc-address:
    get:
      tags:
      - Crypto
      summary: 'Bitcoin address summary (free/keyless): confirmed balance'
      description: 'Bitcoin address summary (free/keyless): confirmed balance (sats + BTC), total received/sent, transaction count, funded/spent output counts, and pending mempool balance + tx count. Works for any BTC address (legacy, SegWit, Taproot). Net-new — our on-chain reads were EVM-only.'
      operationId: crypto_btc-address
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [address summary].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            balanceSats:
                              type: number
                            balanceBtc:
                              type: number
                            totalReceivedBtc:
                              type: number
                            totalSentBtc:
                              type: number
                            txCount:
                              type: number
                              nullable: true
                            fundedTxoCount:
                              type: number
                              nullable: true
                            spentTxoCount:
                              type: number
                              nullable: true
                            mempoolBalanceSats:
                              type: number
                            mempoolTxCount:
                              type: number
                              nullable: true
                          required:
                          - address
                          - balanceSats
                          - balanceBtc
                          - totalReceivedBtc
                          - totalSentBtc
                          - txCount
                          - fundedTxoCount
                          - spentTxoCount
                          - mempoolBalanceSats
                          - mempoolTxCount
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: crypto.btc-address
      x-2s-version: null
      x-2s-price:
        usd: 0.0036
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.003600'
        protocols:
        - x402: {}
      parameters:
      - name: address
        in: query
        required: true
        description: Bitcoin address (1.../3.../bc1...).
        schema:
          type: string
          minLength: 20
          maxLength: 100
      - $ref: '#/components/parameters/TrialMode'
  /api/crypto/btc-fees:
    get:
      tags:
      - Crypto
      summary: Current Bitcoin network fee rates and mempool backlog from
      description: Current Bitcoin network fee rates and mempool backlog from mempool.space. Returns recommended fee rates in satoshis per virtual byte for target confirmation speeds (fastest ~next block, half-hour, hour, economy, minimum) plus the current mempool size (transaction count, total vsize, total fees waiting). Keyless, live. The BTC counterpart to crypto.gas-oracle (Ethereum) — fresh, fast-moving network state an agent cannot recall, for wallets, payment timing, and fee estimation.
      operationId: crypto_btc-fees
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [one fee/mempool snapshot]; total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            recommendedFeesSatPerVByte:
                              type: object
                              properties:
                                fastest:
                                  type: number
                                  nullable: true
                                halfHour:
                                  type: number
                                  nullable: true
                                hour:
                                  type: number
                                  nullable: true
                                economy:
                                  type: number
                                  nullable: true
                                minimum:
                                  type: number
                                  nullable: true
                              required:
                              - fastest
                              - halfHour
                              - hour
                              - economy
                              - minimum
                              additionalProperties: false
                            mempool:
                              type: object
                              properties:
                                txCount:
                                  type: number
                                  nullable: true
                                vsizeBytes:
                                  type: number
                                  nullable: true
                                totalFeeSat:
                                  type: number
                                  nullable: true
                              required:
                              - txCount
                              - vsizeBytes
                              - totalFeeSat
                              additionalProperties: false
                            source:
                              $ref: '#/components/schemas/Source'
                            note:
                              type: string
                          required:
                          - recommendedFeesSatPerVByte
                          - mempool
                          - source
                          - note
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
