                  type: string
                  maxLength: 2
                  description: Sender qualifier.
                receiverQualifier:
                  type: string
                  maxLength: 2
                  description: Receiver qualifier.
                documentNumber:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: Document number.
