openapi: 3.2.0
info:
  title: 2s — the (most) everything Edi API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Edi
paths:
  /api/edi/ack:
    post:
      tags:
      - Edi
      summary: Generate the ANSI ASC X12 997 Functional Acknowledgment for
      description: 'Generate the ANSI ASC X12 997 Functional Acknowledgment for a received EDI interchange. POST { edi } with the raw inbound interchange text (the 850/810/856/etc. you received); returns the ready-to-send 997 in meta.ack — sender/receiver mirrored back, delimiters echoed, one ST(997) per inbound functional group with correct AK1 (functional id + group control number), AK2/AK5 per transaction set, and AK9 with accurate included/received/accepted counts. Set status to control the response: A=Accepted (default), E=Accepted with errors, P=Partially accepted, R=Rejected, M/W/X=authentication/security rejection. Deterministic, no external calls. This is the reply leg of EDI: every transaction set you receive is supposed to be acknowledged, and assembling a valid 997 (especially the AK9 counts) is exactly the fiddly envelope bookkeeping agents shouldn''t hand-roll.'
      operationId: edi_ack
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: meta.ack = the generated 997 text; items = per functional group acknowledged (status + AK9 counts + per-transaction-set response).'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            acknowledgedFunctionalGroup:
                              type: string
                            acknowledgedGroupControlNumber:
                              type: string
                              nullable: true
                            status:
                              type: string
                            transactionSetsIncluded:
                              type: integer
                            transactionSetsReceived:
                              type: integer
                            transactionSetsAccepted:
                              type: integer
                            transactionSets:
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                  controlNumber:
                                    type: string
                                    nullable: true
                                  response:
                                    type: string
                                required:
                                - type
                                - controlNumber
                                - response
                                additionalProperties: false
                          required:
                          - acknowledgedFunctionalGroup
                          - acknowledgedGroupControlNumber
                          - status
                          - transactionSetsIncluded
                          - transactionSetsReceived
                          - transactionSetsAccepted
                          - transactionSets
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          ack:
                            type: string
                            description: The ready-to-send 997 interchange text.
                          controlNumber:
                            type: string
                          acknowledges:
                            type: object
                            properties:
                              senderId:
                                type: string
                                nullable: true
                              receiverId:
                                type: string
                                nullable: true
                              interchangeControlNumber:
                                type: string
                                nullable: true
                              functionalGroupCount:
                                type: integer
                              transactionSetCount:
                                type: integer
                            required:
                            - senderId
                            - receiverId
                            - interchangeControlNumber
                            - functionalGroupCount
                            - transactionSetCount
                            additionalProperties: false
                          delimiters:
                            type: object
                            properties:
                              element:
                                type: string
                              component:
                                type: string
                              segment:
                                type: string
                            required:
                            - element
                            - component
                            - segment
                            additionalProperties: false
                        required:
                        - ack
                        - controlNumber
                        - acknowledges
                        - delimiters
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: edi.ack
      x-2s-version: null
      x-2s-price:
        usd: 0.0045
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.004500'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edi:
                  type: string
                  minLength: 106
                  maxLength: 500000
                  description: Edi.
                status:
                  type: string
                  enum:
                  - A
                  - E
                  - P
                  - R
                  - M
                  - W
                  - X
                  description: Filter results by status.
                controlNumber:
                  type: string
                  maxLength: 15
                  description: Control number.
              required:
              - edi
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/edi/edifact:
    post:
      tags:
      - Edi
      summary: Parse a raw UN/EDIFACT document (the B2B EDI format used
      description: 'Parse a raw UN/EDIFACT document (the B2B EDI format used across Europe, Asia, logistics and customs — the international counterpart to ANSI X12) into clean, structured JSON. POST { edi } with the raw interchange text. Reads the optional UNA service-string advice to auto-detect delimiters (or applies the UN defaults: component '':'', element ''+'', segment "''", release ''?''), handles release-character escaping, then returns the interchange envelope (UNB: syntax id, sender/recipient with qualifiers, date/time, control reference, test indicator), and each message with its type decoded (e.g. ORDERS = Purchase Order, INVOIC = Invoice, DESADV = Despatch Advice/ASN, ORDRSP = PO Response, CONTRL = Acknowledgment) plus version/release/agency from the UNH, every segment named (BGM, DTM, NAD, LIN, QTY, MOA, …), and a semantic summary — for an order that''s the order number, document/delivery dates, parties (buyer/seller/ship-to with role decoded), and line items (product id + quantity); for an invoice the invoice number, currency, parties and total; for a despatch advice the despatch number, date and package/line counts. Deterministic, no external calls. Turns opaque EDIFACT into something an agent can use without hand-rolling a parser.'
      operationId: edi_edifact
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = messages (each decoded + summarized); meta = interchange envelope (UNB) + detected delimiters + counts.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            typeName:
                              type: string
                            reference:
                              type: string
                              nullable: true
                            version:
                              type: string
                              nullable: true
                            release:
                              type: string
                              nullable: true
                            agency:
                              type: string
                              nullable: true
                            segmentCount:
                              type: integer
                            summary:
                              type: object
                              additionalProperties: {}
                              description: Type-specific semantic summary (order/invoice number, parties, line items, totals, etc.).
                            segments:
                              type: array
                              items:
                                type: object
                                properties:
                                  tag:
                                    type: string
                                  name:
                                    type: string
                                  elements:
                                    type: array
                                    items:
                                      anyOf:
                                      - type: string
                                      - type: array
                                        items:
                                          type: string
                                required:
                                - tag
                                - name
                                - elements
                                additionalProperties: false
                          required:
                          - type
                          - typeName
                          - reference
                          - version
                          - release
                          - agency
                          - segmentCount
                          - summary
                          - segments
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          interchange:
                            type: object
                            additionalProperties: {}
                          delimiters:
                            type: object
                            properties:
                              component:
                                type: string
                              element:
                                type: string
                              decimal:
                                type: string
                              release:
                                type: string
                              segment:
                                type: string
                              unaPresent:
                                type: boolean
                            required:
                            - component
                            - element
                            - decimal
                            - release
                            - segment
                            - unaPresent
                            additionalProperties: false
                          messageCount:
                            type: integer
                          segmentCount:
                            type: integer
                        required:
                        - interchange
                        - delimiters
                        - messageCount
                        - segmentCount
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: edi.edifact
      x-2s-version: null
      x-2s-price:
        usd: 0.0045
