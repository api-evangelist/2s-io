      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ns:
                  type: string
                  description: Namespace the document lives in.
                id:
                  type: string
                  description: Document id to fetch.
              required:
              - ns
              - id
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/store/doc-put:
    post:
      tags:
      - Store
      summary: 'STORE: index a text document for full-text keyword search'
      description: 'STORE: index a text document for full-text keyword search, scoped to YOUR wallet. Store body text (up to 1 MB) under an id with optional JSON meta; later find it with store.doc-search (SQLite FTS5 keyword ranking). Re-putting the same id replaces it. Kept on a rolling 90-day window. Private to your wallet (the x402 payer) — no account or API key. Pass redact=true to strip secrets (API keys, tokens, JWTs, private keys — see text.redact) from the body BEFORE it is stored, so agent memory never persists plaintext credentials; the response reports how many were removed.'
      operationId: store_doc-put
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [the stored document].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            bytes:
                              type: number
                            expiresAt:
                              type: string
                            redacted:
                              type: integer
                              description: Count of secrets stripped from the body before storing (0 unless redact=true).
                          required:
                          - id
                          - bytes
                          - expiresAt
                          - redacted
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: store.doc-put
      x-2s-version: null
      x-2s-price:
        usd: 0.005
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ns:
                  type: string
                  description: Namespace to group documents.
                id:
                  type: string
                  description: Document id within the namespace, up to 256 chars.
                body:
                  type: string
                  minLength: 1
                  description: The text to index, up to 1 MB.
                meta:
                  description: Optional JSON metadata returned with search hits (not indexed). e.g. {"title":"notes","tags":["x"]}.
                redact:
                  type: boolean
                  description: When true, strip secrets from body before storing (deja-vu-style index-time redaction). Default false.
              required:
              - ns
              - id
              - body
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/store/doc-search:
    post:
      tags:
      - Store
      summary: 'STORE: full-text keyword search over documents you stored'
      description: 'STORE: full-text keyword search over documents you stored in a namespace, scoped to YOUR wallet. Uses SQLite FTS5 — supports terms, phrases ("..."), AND/OR/NOT, and prefix* matching. Returns ranked hits with body + meta + a relevance score (higher = better). Searching does NOT extend TTLs. Private to your wallet (the x402 payer).'
      operationId: store_doc-search
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = ranked hits (best first).'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            body:
                              type: string
                            meta: {}
                            score:
                              type: number
                          required:
                          - id
                          - body
                          - score
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: store.doc-search
      x-2s-version: null
      x-2s-price:
        usd: 0.005
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ns:
                  type: string
                  description: Namespace to search.
                query:
                  type: string
                  minLength: 1
                  description: FTS5 query. e.g. `invoice AND 2026`, `"exact phrase"`, `lim*`.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Max hits. Default 50, max 1000.
              required:
              - ns
              - query
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/store/kv-delete:
    post:
      tags:
