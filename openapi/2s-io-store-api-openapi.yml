openapi: 3.2.0
info:
  title: 2s — the (most) everything Store API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Store
paths:
  /api/store/blob-delete:
    post:
      tags:
      - Store
      summary: 'STORE: delete a file you uploaded, scoped to YOUR wallet'
      description: 'STORE: delete a file you uploaded, scoped to YOUR wallet — removes the bytes from storage and the metadata. Idempotent: deleting a missing key succeeds with deleted:false. Private to your wallet (the x402 payer).'
      operationId: store_blob-delete
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [the delete result].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            deleted:
                              type: boolean
                          required:
                          - key
                          - deleted
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: store.blob-delete
      x-2s-version: null
      x-2s-price:
        usd: 0.005
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ns:
                  type: string
                  description: Namespace the blob lives in.
                key:
                  type: string
                  description: Key to delete.
              required:
              - ns
              - key
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/store/blob-get:
    post:
      tags:
      - Store
      summary: 'STORE: download a file you uploaded with store.blob-put, in'
      description: 'STORE: download a file you uploaded with store.blob-put, in a single paid call, scoped to YOUR wallet. The response body IS the raw bytes (with the stored Content-Type) — no extra fetch, no public URL. Every read is an x402-tolled call streamed through us, so your data can never be fetched without payment. Reading resets the 90-day TTL. 404 if the key doesn''t exist or has expired. Private to your wallet (the x402 payer).'
      operationId: store_blob-get
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: The raw file bytes, served with the stored Content-Type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: store.blob-get
      x-2s-version: null
      x-2s-price:
        usd: 0.025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.025000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ns:
                  type: string
                  description: Namespace the blob lives in.
                key:
                  type: string
                  description: Key to download.
              required:
              - ns
              - key
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/store/blob-list:
    post:
      tags:
      - Store
      summary: 'STORE: list the files you''ve uploaded in a namespace'
      description: 'STORE: list the files you''ve uploaded in a namespace, scoped to YOUR wallet — keys, sizes, content types, expiry (metadata only, not the bytes). Optional prefix filter + cursor pagination (pass nextCursor as `after`). Listing does NOT extend TTLs or move bytes. Private to your wallet (the x402 payer).'
      operationId: store_blob-list
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = blob metadata; meta.nextCursor for pagination.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            bytes:
                              type: number
                            contentType:
                              type: string
                              nullable: true
                            expiresAt:
                              type: string
                          required:
                          - key
                          - bytes
                          - contentType
                          - expiresAt
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          nextCursor:
                            type: string
                            nullable: true
                        required:
                        - nextCursor
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: store.blob-list
      x-2s-version: null
      x-2s-price:
        usd: 0.005
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ns:
                  type: string
                  description: Namespace to list.
                prefix:
                  type: string
                  description: Only return keys starting with this prefix.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Max keys to return. Default 50, max 1000.
                after:
                  type: string
                  description: Cursor — pass the previous response's nextCursor to page forward.
              required:
              - ns
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/store/blob-put:
    post:
      tags:
      - Store
      summary: 'STORE: upload a file (any bytes) in a single paid call'
      description: 'STORE: upload a file (any bytes) in a single paid call, scoped to YOUR wallet. Send the file base64-encoded in `data` with an optional contentType; we store it privately and key it to your payer address. Read it back with store.blob-get. Up to 3 MB per file (one-call limit); 50 MB total per wallet across kv/documents/vectors/files. Kept on a rolling 90-day window that resets on every touch. There is NO public URL — only paid store.blob-get can read it, so your bytes are never fetchable without payment. No account or API key.'
      operationId: store_blob-put
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [the stored blob metadata].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            bytes:
                              type: number
                            contentType:
                              type: string
                              nullable: true
                            expiresAt:
                              type: string
                          required:
                          - key
                          - bytes
                          - contentType
                          - expiresAt
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: store.blob-put
      x-2s-version: null
      x-2s-price:
        usd: 0.025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.025000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ns:
                  type: string
                  description: Namespace to group blobs, 1-64 chars of [A-Za-z0-9._:-]. e.g. "uploads".
                key:
                  type: string
                  description: Key within the namespace, up to 256 chars. e.g. "snapshot-42.json".
                data:
                  type: string
                  minLength: 1
                  description: The file bytes, base64-encoded. Decoded size up to 3 MB.
                contentType:
                  type: string
                  maxLength: 128
                  description: MIME type to return on read. e.g. "application/json", "image/png". Default application/octet-stream.
              required:
              - ns
              - key
              - data
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
