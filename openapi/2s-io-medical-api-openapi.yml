                            nullable: true
                          company:
                            type: string
                            nullable: true
                          udi:
                            type: string
                            nullable: true
                          limit:
                            type: number
                        required:
                        - device
                        - company
                        - udi
                        - limit
                        additionalProperties: false
                      totalCount:
                        type: number
                      returned:
                        type: number
                      devices:
