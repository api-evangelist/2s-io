openapi: 3.2.0
info:
  title: 2s — the (most) everything Medical API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: medical
paths:
  /api/medical/device-510k:
    get:
      tags:
      - medical
      summary: FDA 510(k) premarket clearances - the record of medical
      description: FDA 510(k) premarket clearances — the record of medical devices cleared for US marketing by demonstrating substantial equivalence to a predicate device. Search by device name, applicant (manufacturer), or FDA product code, and get back each clearance with its K-number, device name, applicant, decision date and decision description, clearance type (traditional/special/abbreviated), product code, advisory committee, and date received — newest decision first. Free, public-domain US government data. Authoritative regulatory-status data for medical-device diligence; point-in-time public records, not regulatory advice.
      operationId: medical_device-510k
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      query:
                        type: object
                        properties:
                          device:
                            type: string
                            nullable: true
                          applicant:
                            type: string
                            nullable: true
                          productCode:
                            type: string
                            nullable: true
                          limit:
                            type: number
                        required:
                        - device
                        - applicant
                        - productCode
                        - limit
                        additionalProperties: false
                      totalCount:
                        type: number
                      returned:
                        type: number
                      clearances:
                        type: array
                        items:
                          type: object
                          properties:
                            kNumber:
                              type: string
                              nullable: true
                            deviceName:
                              type: string
                              nullable: true
                            applicant:
                              type: string
                              nullable: true
                            decisionDate:
                              type: string
                              nullable: true
                            decisionDescription:
                              type: string
                              nullable: true
                            clearanceType:
                              type: string
                              nullable: true
                            productCode:
                              type: string
                              nullable: true
                            advisoryCommittee:
                              type: string
                              nullable: true
                            dateReceived:
                              type: string
                              nullable: true
                            state:
                              type: string
                              nullable: true
                            country:
                              type: string
                              nullable: true
                          required:
                          - kNumber
                          - deviceName
                          - applicant
                          - decisionDate
                          - decisionDescription
                          - clearanceType
                          - productCode
                          - advisoryCommittee
                          - dateReceived
                          - state
                          - country
                          additionalProperties: false
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - query
                    - totalCount
                    - returned
                    - clearances
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: medical.device-510k
      x-2s-version: null
      x-2s-price:
        usd: 0.0045
      x-2s-accepts:
      - x402
      x-2s-response-shape: legacy
