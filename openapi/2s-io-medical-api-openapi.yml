  /api/medical/rxnorm:
    get:
      tags:
      - medical
      summary: Normalize and verify drug names against RxNorm, the
      description: 'Normalize and verify drug names against RxNorm, the canonical US drug vocabulary from the NIH. Two modes: term ("tylenol 500mg", brand or generic, typos tolerated) returns ranked RxCUI candidates with normalized names and match scores; rxcui returns the canonical concept (name, term type like IN=ingredient / SBD=branded drug / SCD=clinical drug, suppression flag) plus related concepts — active ingredients, brand names, and available dose forms. Use before writing prescriptions data, drug interactions queries, or pharmacy integrations: verify the drug exists and get its stable identifier instead of trusting model memory. Sibling: /api/medical/icd10 (diagnosis codes). Public-domain NIH data.'
      operationId: medical_rxnorm
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = ranked RxCUI candidates (term/search mode) or [the one canonical concept] (rxcui/detail mode); total = null in search mode, 1 or 0 in detail mode. meta.mode flags search vs detail; meta.concept + meta.related carry detail-mode extras.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          anyOf:
                          - type: object
                            properties:
                              rxcui:
                                type: string
                              name:
                                type: string
                                description: Normalized RxNorm name.
                              score:
                                type: number
                                description: RxNav approximate-match score (higher = closer).
                              rank:
                                type: number
                                description: 1 = best match.
                            required:
                            - rxcui
                            - name
                            - score
                            - rank
                            additionalProperties: false
                            description: Search-mode candidate (term).
                          - type: object
                            properties:
                              rxcui:
                                type: string
                              name:
                                type: string
                              synonym:
                                type: string
                                nullable: true
                              termType:
                                type: string
                                nullable: true
                                description: IN=ingredient, BN=brand, SBD=branded drug, SCD=clinical drug, …
                              suppressed:
                                type: boolean
                            required:
                            - rxcui
                            - name
                            - synonym
                            - termType
                            - suppressed
                            additionalProperties: false
                            description: Detail-mode canonical concept (rxcui).
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                            - search
                            - detail
                          concept:
                            type: object
                            properties:
                              rxcui:
                                type: string
                              name:
                                type: string
                              synonym:
                                type: string
                                nullable: true
                              termType:
                                type: string
                                nullable: true
                                description: IN=ingredient, BN=brand, SBD=branded drug, SCD=clinical drug, …
                              suppressed:
                                type: boolean
                            required:
                            - rxcui
                            - name
                            - synonym
                            - termType
                            - suppressed
                            additionalProperties: false
                            nullable: true
                            description: Canonical concept (detail mode). Null when the rxcui does not exist.
                          related:
                            type: array
                            items:
                              type: object
                              properties:
                                termType:
                                  type: string
                                concepts:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      rxcui:
                                        type: string
                                      name:
                                        type: string
                                    required:
                                    - rxcui
                                    - name
                                    additionalProperties: false
                              required:
                              - termType
                              - concepts
                              additionalProperties: false
                            nullable: true
                            description: 'Related concepts by term type: IN (ingredients), BN (brands), DF (dose forms). Detail mode only.'
                        required:
                        - mode
                        - concept
                        - related
                        additionalProperties: false
                    required:
                    - ok
