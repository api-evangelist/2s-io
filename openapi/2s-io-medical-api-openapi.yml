                              type: boolean
                              nullable: true
                            mriSafety:
                              type: string
                              nullable: true
                            commercialDistributionStatus:
                              type: string
                              nullable: true
                            publishDate:
                              type: string
                              nullable: true
                            identifiers:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    nullable: true
