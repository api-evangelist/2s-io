                            type: string
                            nullable: true
                          applicationNumber:
                            type: string
                            nullable: true
                          sponsor:
                            type: string
                            nullable: true
                          limit:
                            type: number
                        required:
                        - drug
                        - applicationNumber
                        - sponsor
                        - limit
                        additionalProperties: false
                      totalCount:
                        type: number
                      returned:
                        type: number
                      applications:
                        type: array
