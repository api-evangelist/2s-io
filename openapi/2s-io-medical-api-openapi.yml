                              nullable: true
                            sponsorName:
                              type: string
                              nullable: true
                            products:
                              type: array
                              items:
                                type: object
                                properties:
                                  productNumber:
                                    type: string
                                    nullable: true
                                  brandName:
                                    type: string
                                    nullable: true
                                  activeIngredients:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                        strength:
                                          type: string
                                          nullable: true
                                      required:
