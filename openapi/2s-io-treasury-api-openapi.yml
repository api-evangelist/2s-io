      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = Daily Debt to the Penny.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            record_date:
                              type: string
                            debt_held_public_amt:
                              type: string
                              description: Debt held by the public, USD, as a string (preserves penny precision).
                            intragov_hold_amt:
                              type: string
                              description: Intragovernmental holdings, USD, as a string.
                            tot_pub_debt_out_amt:
                              type: string
                              description: Total public debt outstanding, USD, as a string.
                          additionalProperties: true
                          description: Raw Fiscal Data Debt to the Penny row — all values are strings; columns depend on the `fields` projection and may include additional dataset columns.
                      total:
