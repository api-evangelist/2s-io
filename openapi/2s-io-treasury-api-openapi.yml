  /api/treasury/monthly-statement:
    get:
      tags:
      - treasury
      summary: 'Monthly Treasury Statement (MTS) - Table 4: receipts by'
      description: 'Monthly Treasury Statement (MTS) — Table 4: receipts by source via US Treasury Fiscal Data. Returns monthly totals of federal government receipts grouped by classification (individual income tax, corporate income tax, social-insurance receipts, excise, customs, estate-and-gift, miscellaneous). Each row carries record_date, classification_id, classification_desc, current_month + current_fytd (fiscal year-to-date) gross_rcpt / refund / net_rcpt amounts, plus prior_fytd comparisons. Backbone of any "how much money is the federal government bringing in" question. Use Fiscal Data filter syntax.'
      operationId: treasury_monthly-statement
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = Monthly Treasury Statement (Table 4) — federal receipts by source.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            record_date:
                              type: string
                            classification_id:
                              type: string
                            classification_desc:
                              type: string
                              description: Receipt source, e.g. "Individual Income Taxes:".
                            current_month_gross_rcpt_amt:
                              type: string
                            current_month_refund_amt:
                              type: string
                            current_month_net_rcpt_amt:
                              type: string
                            current_fytd_gross_rcpt_amt:
                              type: string
                              description: Fiscal year-to-date.
                            current_fytd_refund_amt:
                              type: string
                            current_fytd_net_rcpt_amt:
                              type: string
                            prior_fytd_gross_rcpt_amt:
                              type: string
                              description: Prior fiscal year-to-date comparison.
                            prior_fytd_refund_amt:
                              type: string
                            prior_fytd_net_rcpt_amt:
                              type: string
                          additionalProperties: true
                          description: Raw Fiscal Data MTS Table 4 row — all values are strings; columns depend on the `fields` projection and may include additional dataset columns.
