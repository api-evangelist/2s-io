openapi: 3.2.0
info:
  title: 2s — the (most) everything Patents API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: patents
paths:
  /api/patents/detail:
    get:
      tags:
      - patents
      summary: Full US patent application file-wrapper detail by
      description: 'Full US patent application file-wrapper detail by application number. Returns bibliographic data (title, inventors, applicants, dates, status, examiner, art unit, docket #, confirmation #) plus the file-wrapper event timeline (filing, IDS, Office Actions, allowance, abandonment, …), continuity chain (parent / continuation / divisional / national stage), recorded assignments (assignor → assignee with reel/frame + conveyance text), and foreign priority claims under 35 USC § 119. Application number is the 6-10 digit USPTO ID (e.g. 18566276).'
      operationId: patents_detail
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = [the one patent application file-wrapper record] (bibliography, status timeline, continuity, assignments, foreign priority); total = 1.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            applicationNumber:
                              type: string
                              description: USPTO application number (e.g. "18566276").
                            title:
                              type: string
                              nullable: true
                            applicationType:
                              type: string
                              nullable: true
                              description: Utility | Design | Plant | Reissue.
                            firstInventor:
                              type: string
                              nullable: true
                            inventors:
                              type: array
                              items:
                                type: string
                            applicants:
                              type: array
                              items:
                                type: string
                            filingDate:
                              type: string
                              nullable: true
                            effectiveFilingDate:
                              type: string
                              nullable: true
                            status:
                              type: object
                              properties:
                                code:
                                  type: number
                                  nullable: true
                                description:
                                  type: string
                                  nullable: true
                                updatedAt:
                                  type: string
                                  nullable: true
                              required:
                              - code
                              - description
                              - updatedAt
                              additionalProperties: false
                              description: Latest application status code + plain-English description.
                            cpcSymbols:
                              type: array
                              items:
                                type: string
                              description: CPC class symbols (e.g. "H04W 72/0446").
                            uspcSymbol:
                              type: string
                              nullable: true
                              description: Legacy USPC class.subclass.
                            url:
                              type: string
                              description: Public USPTO Patent Center file-wrapper URL.
                            examiner:
                              type: string
                              nullable: true
                              description: Examiner of record.
                            artUnit:
                              type: string
                              nullable: true
                              description: USPTO group art unit.
                            confirmationNumber:
                              type: string
                              nullable: true
                            docketNumber:
                              type: string
                              nullable: true
                              description: Docket number assigned by the filer / counsel.
                            events:
                              type: array
                              items:
                                type: object
                                properties:
                                  code:
                                    type: string
                                    nullable: true
                                    description: USPTO event code, e.g. "CTNF", "PILS".
                                  description:
                                    type: string
                                    nullable: true
                                  date:
                                    type: string
                                    nullable: true
                                required:
                                - code
                                - description
                                - date
                                additionalProperties: false
                              description: File-wrapper event timeline (filing, IDS, Office Actions, allowance, …).
                            parents:
                              type: array
                              items:
                                type: object
                                properties:
                                  parentApplicationNumber:
                                    type: string
                                    nullable: true
                                    description: May be PCT-shaped, not always pure digits.
                                  parentFilingDate:
                                    type: string
                                    nullable: true
                                  parentStatusDescription:
                                    type: string
                                    nullable: true
                                  relationship:
                                    type: string
                                    nullable: true
                                    description: e.g. "is a Continuation of", "is a National Stage Entry of".
                                required:
                                - parentApplicationNumber
                                - parentFilingDate
                                - parentStatusDescription
                                - relationship
                                additionalProperties: false
                              description: Continuity chain (parent / continuation / divisional / national stage).
                            assignments:
                              type: array
                              items:
                                type: object
                                properties:
                                  reelFrame:
                                    type: string
                                    nullable: true
                                    description: Reel-frame identifier ("12345-678").
                                  conveyanceText:
                                    type: string
                                    nullable: true
                                  recordedAt:
                                    type: string
                                    nullable: true
                                  assignors:
                                    type: array
                                    items:
                                      type: string
                                  assignees:
                                    type: array
                                    items:
                                      type: string
                                required:
                                - reelFrame
                                - conveyanceText
                                - recordedAt
                                - assignors
                                - assignees
                                additionalProperties: false
                              description: Recorded assignments (chain of ownership).
                            foreignPriority:
                              type: array
                              items:
                                type: object
                                properties:
                                  country:
                                    type: string
                                    nullable: true
                                  applicationNumber:
                                    type: string
                                    nullable: true
                                  filingDate:
                                    type: string
                                    nullable: true
                                required:
                                - country
                                - applicationNumber
                                - filingDate
                                additionalProperties: false
                              description: Foreign priority claims under 35 USC § 119.
                          required:
                          - applicationNumber
                          - title
                          - applicationType
                          - firstInventor
                          - inventors
                          - applicants
                          - filingDate
                          - effectiveFilingDate
                          - status
                          - cpcSymbols
                          - uspcSymbol
                          - url
                          - examiner
                          - artUnit
                          - confirmationNumber
                          - docketNumber
                          - events
                          - parents
                          - assignments
                          - foreignPriority
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: patents.detail
      x-2s-version: null
      x-2s-price:
        usd: 0.0045
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.004500'
        protocols:
        - x402: {}
      parameters:
      - name: applicationNumber
        in: query
        required: true
        description: Application number.
        schema:
          type: string
          pattern: ^[0-9]{6,10}$
      - $ref: '#/components/parameters/TrialMode'
  /api/patents/documents:
    get:
      tags:
      - patents
      summary: List every document in the file wrapper for a US patent
      description: List every document in the file wrapper for a US patent application. Returns each document with its USPTO code (e.g. CTNF non-final OA, CTFR final OA, IDS, WCLM claims worksheet, NOA notice of allowance), human-readable description, official date, direction (INTERNAL/INCOMING/OUTGOING), and available formats with page counts. Includes patentCenterUrl pointing at the public USPTO Patent Center documents page for direct PDF download. Application number is the 6-10 digit USPTO ID.
      operationId: patents_documents
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = file-wrapper documents (code, description, date, direction, formats); total = upstream document count; meta.applicationNumber + meta.patentCenterUrl identify the application.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            applicationNumber:
                              type: string
                            documentId:
                              type: string
                              description: Stable USPTO document identifier.
                            code:
                              type: string
                              nullable: true
                              description: USPTO document code, e.g. "CTNF", "IDS", "NOA".
                            description:
                              type: string
                              nullable: true
                            officialDate:
                              type: string
                              nullable: true
                            direction:
                              type: string
                              nullable: true
                              description: INTERNAL (USPTO-generated), INCOMING, or OUTGOING.
                            formats:
                              type: array
                              items:
                                type: object
                                properties:
                                  mimeType:
                                    type: string
                                  pageCount:
                                    type: number
                                    nullable: true
                                required:
                                - mimeType
                                - pageCount
                                additionalProperties: false
                              description: Available formats with page counts (download via Patent Center, see meta.patentCenterUrl).
                          required:
                          - applicationNumber
                          - documentId
                          - code
                          - description
                          - officialDate
                          - direction
                          - formats
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          applicationNumber:
                            type: string
                          patentCenterUrl:
                            type: string
                            description: Public USPTO Patent Center documents page for direct PDF download.
                        required:
                        - applicationNumber
                        - patentCenterUrl
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
