openapi: 3.2.0
info:
  title: 2s — the (most) everything Watchers API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Watchers
paths:
  /api/watchers/business-earnings:
    post:
      tags:
      - Watchers
      summary: 'WATCHER: get a signed callback around a US company''s earnings'
      description: 'WATCHER: get a signed callback around a US company''s earnings. Arm once, pay once (no account, no API key). trigger ''reported'' (default) fires when results post — with reported EPS vs estimate, the surprise, and revenue; trigger ''upcoming'' fires daysBefore the scheduled report date as a heads-up. Pass ticker (+ optional daysBefore for upcoming). Fires once per report period; bounded by a maxFires / expiry budget. Calendar via Finnhub. Deliveries are EIP-191-signed (verify offline) and retried with exponential backoff; missed pushes are recoverable via watchers.status. Returns a watcherId.'
      operationId: watchers_business-earnings
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [the armed business-earnings watcher].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            watcherId:
                              type: string
                            status:
                              type: string
                            ticker:
                              type: string
                            trigger:
                              type: string
                            daysBefore:
                              type: number
                              nullable: true
                            maxFires:
                              type: number
                            firesRemaining:
                              type: number
                            expiresAt:
                              type: string
                            statusUrl:
                              type: string
                            callbackSigner:
                              type: string
                          required:
                          - watcherId
                          - status
                          - ticker
                          - trigger
                          - daysBefore
                          - maxFires
                          - firesRemaining
                          - expiresAt
                          - statusUrl
                          - callbackSigner
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: watchers.business-earnings
      x-2s-version: null
      x-2s-price:
        usd: 0.125
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.125000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticker:
                  type: string
                  minLength: 1
                  maxLength: 12
                  pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,11}$
                  description: US-listed ticker to watch, e.g. AAPL.
                trigger:
                  type: string
                  enum:
                  - reported
                  - upcoming
                  description: '''reported'' (default) fires when results post; ''upcoming'' fires ahead of the scheduled date.'
                daysBefore:
                  type: integer
                  minimum: 0
                  maximum: 30
                  description: 'For trigger=''upcoming'': how many days before the report date to fire (default 1).'
                callbackUrl:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Where we POST the event. Any http(s) URL; the JSON body is signed (verify with X-2s-Signature). e.g. https://your-agent.app/hooks/earnings
                payload:
                  type: object
                  additionalProperties: {}
                  description: Arbitrary JSON echoed back verbatim in every callback so you can route/identify the event. e.g. {"agentId":"a1"}
                expiresInSeconds:
                  type: integer
                  minimum: 60
                  maximum: 7776000
                  description: How long the watch stays active, in seconds. Default 2592000 (30 days), max 7776000 (90 days).
                maxFires:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Stop after this many report events (default 1 — the next report). Each fire is a distinct fiscal period.
                label:
                  type: string
                  maxLength: 64
                  description: Optional free-text tag to recognize this watcher later.
              required:
              - ticker
              - callbackUrl
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
  /api/watchers/cancel:
    post:
      tags:
      - Watchers
      summary: Cancel an active watcher by watcherId - it stops watching
      description: 'Cancel an active watcher by watcherId — it stops watching immediately. Flat-fee model: no refund of the unused window (nothing is held or owed). Idempotent. Pairs with watchers.crypto-address-activity and watchers.status.'
      operationId: watchers_cancel
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = [{ watcherId, status }].'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            watcherId:
                              type: string
                            status:
                              type: string
                          required:
                          - watcherId
                          - status
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: watchers.cancel
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watcherId:
                  type: string
                  minLength: 8
                  maxLength: 80
                  description: Watcher ID.
              required:
              - watcherId
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TrialMode'
