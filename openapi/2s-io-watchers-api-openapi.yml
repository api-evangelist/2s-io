          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: watchers.dns
      x-2s-version: null
      x-2s-price:
        usd: 0.125
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.125000'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Hostname to monitor, e.g. example.com.
                callbackUrl:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Signed event POSTed here (verify X-2s-Signature). Any http(s) URL.
                payload:
                  type: object
                  additionalProperties: {}
                  description: Arbitrary JSON echoed back in every callback.
                expiresInSeconds:
                  type: integer
                  minimum: 60
                  maximum: 7776000
                  description: Active window in seconds (default 30d, max 90d).
                maxFires:
                  type: integer
                  minimum: 1
