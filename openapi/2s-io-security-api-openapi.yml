openapi: 3.2.0
info:
  title: 2s — the (most) everything Security API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Security
paths:
  /api/security/attack:
    get:
      tags:
      - Security
      summary: Authoritative MITRE ATT&CK (Enterprise) technique lookup
      description: Authoritative MITRE ATT&CK (Enterprise) technique lookup. Pass id (e.g. T1059 or sub-technique T1059.001) for the canonical technique — name, tactics (kill-chain phases), description, platforms, sub-technique flag + parent, mitigations, and detection guidance — or query for a keyword search returning ranked techniques. Bundled current ATT&CK matrix (~700 techniques), zero external calls. Agents cite T-numbers and tactic names that must be exact; this returns version-pinned, citeable data instead of hallucinated IDs. For threat modeling, detection engineering, and report enrichment.
      operationId: security_attack
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items=[{mode:lookup,item}] or search results.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - lookup
                              - search
                              description: lookup when id was given, search when query was given.
                            item:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: ATT&CK technique id (T1059 / T1059.001).
                                name:
                                  type: string
                                tactics:
                                  type: array
                                  items:
                                    type: string
                                  description: Kill-chain phases, e.g. "execution".
                                description:
                                  type: string
                                platforms:
                                  type: array
                                  items:
                                    type: string
                                isSubtechnique:
                                  type: boolean
                                parent:
                                  type: string
                                  nullable: true
                                  description: Parent technique id for sub-techniques.
                                mitigations:
                                  type: array
                                  items:
                                    type: string
                                detection:
                                  type: string
                                  nullable: true
                              required:
                              - id
                              - name
                              - tactics
                              - description
                              - platforms
                              - isSubtechnique
                              - parent
                              - mitigations
                              - detection
                              additionalProperties: false
                              description: 'Lookup mode only: the canonical technique.'
                            total:
                              type: number
                              description: 'Search mode only: total ranked matches.'
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                  abstraction:
                                    type: string
                                  description:
                                    type: string
                                    nullable: true
                                    description: Truncated to 200 chars.
                                required:
                                - id
                                - name
                                - description
                                additionalProperties: false
                              description: 'Search mode only: ranked matches (page of total).'
                            source:
                              $ref: '#/components/schemas/Source'
                          required:
                          - mode
                          - source
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: security.attack
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
