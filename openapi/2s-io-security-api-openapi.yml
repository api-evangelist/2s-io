  /api/security/cve-changes:
    get:
      tags:
      - Security
      summary: CVE change feed - the CVE records MODIFIED within a time
      description: CVE change feed — the CVE records MODIFIED within a time window, so an agent can incrementally maintain a vulnerability view instead of re-scanning. Pass since (YYYY-MM-DD or ISO datetime); until defaults to now (window must be ≤ 120 days, the NVD limit). Optionally narrow by keyword (product/text) or cpe (exact CPE). Returns each changed CVE with its id, published + lastModified timestamps, current vulnStatus (e.g. Modified, Analyzed, Rejected), best-available CVSS score/severity, description, and kevListed — whether it is now on the CISA Known-Exploited Vulnerabilities catalog (the high-signal flag for a poller). Newest modification first. Sourced live from NVD (NIST) + CISA KEV, free/keyless. Pair with security.cve for full per-CVE detail.
      operationId: security_cve-changes
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items = CVEs modified in the window (newest first, KEV-flagged); meta.window + total.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            published:
                              type: string
                              nullable: true
                            lastModified:
                              type: string
                              nullable: true
                            vulnStatus:
                              type: string
                              nullable: true
                            description:
                              type: string
                              nullable: true
                            cvss:
                              type: object
                              additionalProperties: {}
                              nullable: true
                            kevListed:
                              type: boolean
                          required:
                          - id
                          - published
                          - lastModified
                          - vulnStatus
                          - description
                          - cvss
                          - kevListed
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          window:
                            type: object
                            properties:
                              since:
                                type: string
                              until:
                                type: string
                            required:
                            - since
                            - until
                            additionalProperties: false
                          total:
                            type: integer
                        required:
                        - window
                        - total
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
