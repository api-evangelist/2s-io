      summary: Authoritative MITRE CWE (Common Weakness Enumeration) lookup
      description: Authoritative MITRE CWE (Common Weakness Enumeration) lookup. Pass id (e.g. CWE-79, or just 79) for the canonical weakness — name, abstraction, description, extended description, ChildOf/ParentOf relationships (with names), and mapped CAPEC attack patterns (with names) — or query for a keyword search returning ranked matches. Bundled catalog (~970 weaknesses), zero external calls. Agents hallucinate CWE IDs and names constantly; this returns exact, citeable, version-pinned data. Pairs with security.cve (which returns CWE ids) and security.capec.
      operationId: security_cwe
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized envelope: items=[{mode:lookup,item}] or search results.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - lookup
                              - search
                              description: lookup when id was given, search when query was given.
                            item:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: CWE id (e.g. CWE-79).
                                name:
                                  type: string
                                abstraction:
                                  type: string
                                status:
                                  type: string
                                description:
                                  type: string
                                extended:
                                  type: string
                                  nullable: true
                                  description: Extended description.
                                relationships:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      nature:
                                        type: string
                                      cwe:
                                        type: string
                                      name:
                                        type: string
                                        nullable: true
                                    required:
                                    - nature
                                    - cwe
                                    - name
                                    additionalProperties: false
                                  description: ChildOf/ParentOf/etc. relationships with canonical names.
                                mappedCapec:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      capec:
                                        type: string
                                      name:
                                        type: string
                                        nullable: true
                                    required:
                                    - capec
                                    - name
                                    additionalProperties: false
                                  description: Mapped CAPEC attack patterns with canonical names.
                              required:
                              - id
                              - name
                              - abstraction
                              - status
                              - description
                              - extended
                              - relationships
                              - mappedCapec
                              additionalProperties: false
