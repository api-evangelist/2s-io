  /api/stocks/insider-sentiment:
    get:
      tags:
      - Stocks
      summary: Aggregated insider sentiment for a US-listed company, by month
      description: Aggregated insider sentiment for a US-listed company, by month. For each month returns the net change in insider share holdings and Finnhub's MSPR (Monthly Share Purchase Ratio, −100 to +100 — higher means more net insider buying). Pass ticker and optionally a from/to window (YYYY-MM-DD; defaults to ~1 year). A distilled signal layered on top of raw insider filings. Data by Finnhub.
      operationId: stocks_insider-sentiment
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = monthly insider sentiment rows.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            symbol:
                              type: string
                              nullable: true
                            year:
                              type: number
                              nullable: true
                            month:
                              type: number
                              nullable: true
                            change:
                              type: number
                              nullable: true
                              description: Net change in insider share holdings for the month.
                            mspr:
                              type: number
                              nullable: true
                              description: Monthly Share Purchase Ratio, −100..+100.
                          required:
                          - symbol
                          - year
                          - month
                          - change
                          - mspr
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          symbol:
                            type: string
                          from:
                            type: string
                          to:
                            type: string
                        required:
                        - symbol
                        - from
                        - to
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
