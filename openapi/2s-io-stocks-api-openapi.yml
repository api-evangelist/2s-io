openapi: 3.2.0
info:
  title: 2s — the (most) everything Stocks API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Stocks
paths:
  /api/stocks/company-news:
    get:
      tags:
      - Stocks
      summary: Recent news articles about a specific US-listed company
      description: Recent news articles about a specific US-listed company. Pass ticker and optionally a from/to date window (YYYY-MM-DD; defaults to the last 14 days); returns headlines with source, summary, URL, image, related symbol, category, and publish time (newest first). Use it to catch up on what is being written about a company. News aggregated by Finnhub.
      operationId: stocks_company-news
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = company news articles, newest first.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            datetime:
                              type: string
                              nullable: true
                              description: Publish time (ISO 8601).
                            headline:
                              type: string
                              nullable: true
                            source:
                              type: string
                              nullable: true
                            summary:
                              type: string
                              nullable: true
                            url:
                              type: string
                              nullable: true
                            image:
                              type: string
                              nullable: true
                            category:
                              type: string
                              nullable: true
                            related:
                              type: string
                              nullable: true
                            id:
                              type: number
                              nullable: true
                          required:
                          - datetime
                          - headline
                          - source
                          - summary
                          - url
                          - image
                          - category
                          - related
                          - id
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          symbol:
                            type: string
                          from:
                            type: string
                          to:
                            type: string
                        required:
                        - symbol
                        - from
                        - to
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: stocks.company-news
      x-2s-version: null
      x-2s-price:
        usd: 0.0025
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002500'
        protocols:
        - x402: {}
      parameters:
      - name: ticker
        in: query
        required: true
        description: US-listed ticker symbol.
        schema:
          type: string
          minLength: 1
          maxLength: 12
          pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,11}$
      - name: from
        in: query
        required: false
        description: 'Earliest article date YYYY-MM-DD (default: 14 days ago).'
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: to
        in: query
        required: false
        description: 'Latest article date YYYY-MM-DD (default: today).'
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: limit
        in: query
        required: false
        description: Max articles to return (default 100).
        schema:
          type: integer
          minimum: 1
          maximum: 250
      - $ref: '#/components/parameters/TrialMode'
  /api/stocks/earnings-surprises:
    get:
      tags:
      - Stocks
      summary: Historical quarterly earnings surprises for a US-listed
      description: Historical quarterly earnings surprises for a US-listed company — reported (actual) EPS vs the analyst consensus estimate, the absolute surprise, and the surprise percentage, for the most recent quarters (newest first). Pass ticker (optionally limit). Tells you whether a company has been beating or missing expectations. Data by Finnhub.
      operationId: stocks_earnings-surprises
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = quarterly EPS actual-vs-estimate, newest first.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            period:
                              type: string
                              description: Fiscal period end date (yyyy-mm-dd).
                            actual:
                              type: number
                              nullable: true
                              description: Reported EPS.
                            estimate:
                              type: number
                              nullable: true
                              description: Consensus estimated EPS.
                            surprise:
                              type: number
                              nullable: true
                              description: actual − estimate.
                            surprisePercent:
                              type: number
                              nullable: true
                            quarter:
                              type: number
                              nullable: true
                            year:
                              type: number
                              nullable: true
                          required:
                          - period
                          - actual
                          - estimate
                          - surprise
                          - surprisePercent
                          - quarter
                          - year
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          symbol:
                            type: string
                        required:
                        - symbol
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: stocks.earnings-surprises
