openapi: 3.2.0
info:
  title: 2s — the (most) everything Predict API
  version: '1'
  summary: The (most) everything API.
  description: 'The (most) everything API for AI agents: 575+ pay-per-call endpoints on one origin.'
  contact:
    name: 2s
    url: https://2s.io
    email: alley@2s.io
  x-logo:
    url: https://2s.io/icon-512.png
    altText: 2s
  x-guidance: 'Pay-per-call REST API for AI agents — hundreds of endpoints returning ground-truth data (US public records, company & legal identifiers, finance/SEC, crypto/web3, security & CVEs, medical codes, weather & geocoding, agriculture, energy, maritime, music, and more). Every endpoint is paid per call in USDC via x402 (Base or Solana) — no API key, no signup. Call any endpoint with no auth to get a 402 PaymentRequirements envelope, sign it (EIP-3009 on Base, partial SPL transfer on Solana), and retry with the PAYMENT-SIGNATURE header. Add ?trial=1 for one free real call per endpoint per hour to test before paying. To discover the right endpoint: GET https://2s.io/api/directory for the full catalog, or GET https://2s.io/api/search/endpoints?q=<natural-language task> for a ranked match. Per-call price is on each operation as x-payment-info (from $0.001). Batch up to 50 calls behind one payment via POST https://2s.io/api/batch/run.'
servers:
- url: https://2s.io
tags:
- name: Predict
paths:
  /api/predict/activity:
    get:
      tags:
      - Predict
      summary: 'A wallet''s Polymarket on-chain activity feed: trades'
      description: 'A wallet''s Polymarket on-chain activity feed: trades, merges, splits, redeems, conversions and rewards, newest first. Pass the wallet (proxy) address; optionally filter by type (TRADE/MERGE/SPLIT/REDEEM/REWARD/CONVERSION) and cap with limit. Each entry returns type, side, outcome, share size, price, USD value, timestamp, the market title/slug, conditionId, and tx hash. Read-only from Polymarket''s Data API.'
      operationId: predict_activity
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = activity events, newest first.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              nullable: true
                            side:
                              type: string
                              nullable: true
                            outcome:
                              type: string
                              nullable: true
                            size:
                              type: number
                              nullable: true
                            price:
                              type: number
                              nullable: true
                            usd:
                              type: number
                              nullable: true
                            timestamp:
                              type: number
                              nullable: true
                            title:
                              type: string
                              nullable: true
                            slug:
                              type: string
                              nullable: true
                            eventSlug:
                              type: string
                              nullable: true
                            conditionId:
                              type: string
                              nullable: true
                            txHash:
                              type: string
                              nullable: true
                          required:
                          - type
                          - side
                          - outcome
                          - size
                          - price
                          - usd
                          - timestamp
                          - title
                          - slug
                          - eventSlug
                          - conditionId
                          - txHash
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          address:
                            type: string
                          count:
                            type: integer
                        required:
                        - address
                        - count
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: predict.activity
      x-2s-version: null
      x-2s-price:
        usd: 0.012
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.012000'
        protocols:
        - x402: {}
      parameters:
      - name: address
        in: query
        required: true
        description: Wallet (proxy) address.
        schema:
          type: string
          minLength: 8
          maxLength: 60
      - name: limit
        in: query
        required: false
        description: Max events (default 50).
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: type
        in: query
        required: false
        description: Filter by activity type.
        schema:
          type: string
          enum:
          - TRADE
          - MERGE
          - SPLIT
          - REDEEM
          - REWARD
          - CONVERSION
      - $ref: '#/components/parameters/TrialMode'
  /api/predict/crypto-updown:
    get:
      tags:
      - Predict
      summary: Polymarket crypto up-or-down markets - the recurring 'Will
      description: Polymarket crypto up-or-down markets — the recurring 'Will be up or down by ?' series for BTC, ETH, SOL, SPX and more (hourly/daily). Each event returns its question, dates, USD volume, and the nested Up/Down markets with live outcome prices (implied probability the asset closes higher). Filter count with limit. Read-only mirror of Polymarket's up-or-down tag.
