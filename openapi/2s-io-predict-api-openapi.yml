                            id:
                              type: string
                              nullable: true
                            ticker:
                              type: string
                              nullable: true
                            title:
                              type: string
                              nullable: true
                            slug:
                              type: string
                              nullable: true
                            description:
                              type: string
                              nullable: true
                            volumeUsd:
                              type: number
                              nullable: true
                            volume24hrUsd:
                              type: number
                              nullable: true
                            liquidityUsd:
                              type: number
                              nullable: true
                            active:
                              type: boolean
                              nullable: true
                            closed:
                              type: boolean
                              nullable: true
                            startDate:
                              type: string
                              nullable: true
                            endDate:
                              type: string
                              nullable: true
                            tags:
                              type: array
                              items:
                                type: string
                            marketCount:
                              type: number
                              nullable: true
                            markets:
                              type: array
                              items:
                                type: object
                                properties:
                                  question:
                                    type: string
                                    nullable: true
                                  slug:
                                    type: string
                                    nullable: true
                                  conditionId:
                                    type: string
                                    nullable: true
                                  outcomes:
                                    type: array
                                    items:
                                      type: string
                                  outcomePrices:
                                    type: array
                                    items:
                                      type: number
                                  clobTokenIds:
                                    type: array
                                    items:
                                      type: string
                                  volumeUsd:
                                    type: number
                                    nullable: true
                                  closed:
                                    type: boolean
                                    nullable: true
                                required:
                                - question
                                - slug
                                - conditionId
                                - outcomes
                                - outcomePrices
                                - clobTokenIds
                                - volumeUsd
                                - closed
                                additionalProperties: false
                            url:
                              type: string
                              nullable: true
                          required:
                          - id
                          - ticker
                          - title
                          - slug
                          - description
                          - volumeUsd
                          - volume24hrUsd
                          - liquidityUsd
                          - active
                          - closed
                          - startDate
                          - endDate
                          - tags
                          - marketCount
                          - markets
                          - url
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                      meta:
                        type: object
                        properties:
                          count:
                            type: integer
                        required:
                        - count
                        additionalProperties: false
                    required:
                    - ok
                    - items
                    - total
                    - source
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/CallMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
      x-2s-id: predict.crypto-updown
      x-2s-version: null
      x-2s-price:
        usd: 0.012
      x-2s-accepts:
      - x402
      x-2s-response-shape: normalized
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.012000'
        protocols:
        - x402: {}
      parameters:
      - name: limit
        in: query
        required: false
        description: Max events (default 20).
        schema:
          type: integer
          minimum: 1
