      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = Polymarket crypto up/down events.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
