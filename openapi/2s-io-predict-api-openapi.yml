  /api/predict/holders:
    get:
      tags:
      - Predict
      summary: Top holders of a Polymarket market, grouped by outcome
      description: 'Top holders of a Polymarket market, grouped by outcome token (conditionId). Each holder: wallet, trader name, position size, outcome index, and verified flag. Reveals concentration and smart-money positioning per outcome — the holder-side complement to predict.trades (flow) and predict.whales (large trades). Read-only from Polymarket''s Data API.'
      operationId: predict_holders
      deprecated: false
      security:
      - x402Payment: []
      responses:
        '200':
          description: 'Normalized: items = one group per outcome token, each with ranked holders.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            token:
                              nullable: true
                            holders:
                              type: array
                              items:
                                type: object
                                properties:
                                  wallet:
                                    nullable: true
                                  name:
                                    nullable: true
                                  amount:
                                    type: number
                                    nullable: true
                                  outcomeIndex:
                                    type: number
                                    nullable: true
                                  verified:
                                    type: boolean
                                  bio:
                                    type: string
                                    nullable: true
                                required:
                                - amount
                                - outcomeIndex
                                - verified
                                - bio
                                additionalProperties: false
                          required:
                          - holders
                          additionalProperties: false
                      total:
                        type: integer
                        nullable: true
                        description: Total matching rows upstream; null when unknown.
                      source:
                        $ref: '#/components/schemas/Source'
                    required:
