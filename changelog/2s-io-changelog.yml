- version: 1.80.5
  date: '2026-07-22'
  summary: 'Integrity-audit fixes: honest threat-feed availability on security.ioc-reputation, storage-cleanup hardening,
    watcher status/scan-set fixes.'
  breaking: false
  additions: 3
  highlights:
  - 'security.ioc-reputation — a down threat feed is no longer reported as "not listed": unavailable sources are
    excluded from sourcesChecked and surfaced in a new sourcesUnavailable field; if every source is unreachable
    the endpoint returns 502 instead of a clean verdict'
  - 'Store TTL cleanup hardening: expired-blob metadata rows are only dropped once their bytes are confirmed deleted,
    and mass-expiry waves are processed in bounded batches per run'
  - watchers.status now reports firesRemaining 0 for cancelled/completed/expired watchers; fixed a create/retire
    race that could leave a newly armed watcher out of the poll scan set
- version: 1.80.1
  date: '2026-07-08'
  summary: 'Integrity-audit fixes: country.lookup dataset backfill, space.weather feed repoint, upstream rate-limit
    error-code normalization.'
  breaking: false
  additions: 3
  highlights:
  - country.lookup — population, flagSvg/flagPng, Google/OpenStreetMap URLs, drivingSide, and timezones are now
    populated for all 250 countries (the bundled dataset had shipped them null/empty)
  - space.weather — repointed the solar-wind plasma feed after NOAA SWPC removed /products/solar-wind/ (now the
    geospace propagated-solar-wind product, with an independent RTSW fallback)
  - 'Error-code normalization: upstream throttles now return 503 UPSTREAM_RATE_LIMIT everywhere (previously some
    endpoints returned 429 RATE_LIMITED for an upstream throttle — crypto.*, github.*, sports.*, search.web, business/GLEIF
    lookups, SEC form 144, dev.*). 429 RATE_LIMITED now always means OUR limiter; retry upstream throttles without
    client-side backoff'
- version: 1.80.0
  date: '2026-07-02'
  summary: 'upto billing (x402 first): authorize the quoted max, pay actual usage — live on all AI endpoints.'
  breaking: false
  additions: 4
  highlights:
  - 'upto billing — 2s is the first x402 API to settle ACTUAL usage: AI endpoints (chat, image, council, summarize,
    extract, translate, entities, pii, research, web-answer, describe-image, ocr, transcribe) also accept the Permit2-based
    x402 upto scheme. Authorize the quoted worst-case, settle only what your request used — a real on-chain call
    authorized $0.0549 and settled $0.0013. Exact-scheme clients are unchanged; exact stays first in accepts'
  - 'Agent store/control-plane hardening: per-tenant quotas (50 MB storage across kv/doc/vector/blob, 1,000 queue
    depth, 100 concurrent locks); store.usage now reports totalBytes + capBytes headroom'
  - 'Per-model image pricing: per-image-billed models (FLUX, Imagen, Recraft, Seedream, Grok Imagine) priced from
    verified list prices; unpriced models are refused instead of mispriced; /api/ai/models now classifies by real
    model type'
  - SDK / MCP / Python 1.80.0 with refreshed catalogs and docs
- version: 1.77.0
  date: '2026-06-21'
  summary: econ.fred-regional — FRED regional economic data across all states/counties/metros.
  breaking: false
  additions: 3
  highlights:
  - 'econ.fred-regional — one snapshot of a regional FRED series across ALL its geographies (every US state, county,
    or metro) for a single period: each region’s name, FIPS region code, value, and per-region series id'
  - Pass a regional series id (e.g. WIPCPI = per-capita personal income by state) + optional date for a point-in-time
    cross-section; returns units, frequency, and available date range
  - Authoritative St. Louis Fed (GeoFRED) data agents can’t recite — per-state income, county unemployment, regional
    GDP; free, public-domain; companion to econ.fred + econ.fred-categories
