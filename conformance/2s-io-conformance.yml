summary: >-
  2s's conformance profile is the agent-commerce and agent-discovery protocol stack rather than any enterprise
  standard, and unusually much of it is verifiable from the outside: a live x402 v2 402 envelope observed on a
  real endpoint, an A2A 0.3.0 card graded conformant, an MCP server at protocol 2025-06-18 answering anonymous
  tools/list, an RFC 9727 API catalog served with the correct application/linkset+json media type, an APIs.json
  0.16 index, an llms.txt, an OpenAI ai-plugin manifest, a Wildcard agents.json, an ERC-8004 on-chain agent
  registration, an MCP server card, and a documented EIP-191 response-attestation scheme. In its own market it
  declares two domain standards inside the contract — ANSI ASC X12 and UN/EDIFACT message types on the edi
  group — and an OpenAI-compatible chat-completions request/response shape on the AI gateway. It declares no
  OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 8594 sunset signalling and no
  Idempotency-Key.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: observed
  evidence: >-
    GET https://2s.io/api/validate/iban?iban=… (no auth) returned HTTP 402, application/json, x402Version 2,
    accepts[] with two exact-scheme rails (eip155:8453 USDC amount "2500", payTo 0x2b6D…32C5; solana:5eykt… USDC
    amount "2500", payTo TW6n…yWhn, feePayer), resource {url, description, mimeType, serviceName, iconUrl,
    tags}, error "PAYMENT-SIGNATURE required", extensions.bazaar {info.input, info.output.example + schema},
    plus a PAYMENT-REQUIRED response header carrying the same envelope base64-encoded and
    x-payment-requirements: x402. Every one of the 575 operations declares the 402 response
    (components.responses.PaymentRequired → X402PaymentRequiredV2) and the x402Payment apiKey scheme on
    PAYMENT-SIGNATURE. The provider also serves /.well-known/x402 (x402Version 2, 575 endpoints with prices).
  note: The paid retry (PAYMENT-SIGNATURE + X-PAYMENT-TX on the 200) was not exercised — that requires spending USDC. The upto scheme (Permit2, actual-usage settlement) is documented on AI endpoints and in changelog 1.80.0 but was not observed in the 402 accepts[] of the IBAN endpoint, which is a fixed-price operation.
  domain_standard_signature: true
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  evidence: a2a/2s-io-agent-card.json — protocolVersion "0.3.0", url https://2s.io/a2a, preferredTransport JSONRPC, capabilities object, skills[] of 1; POST https://2s.io/a2a answered JSON-RPC 2.0 with -32601 naming message/send as the supported method. Graded conformant in a2a/2s-io-a2a.yml.
- id: mcp
  name: Model Context Protocol
  version: '2025-06-18'
  conforms: true
  evidence: 'POST https://2s.io/mcp initialize returned protocolVersion "2025-06-18", serverInfo {2s.io, 1.0.0}, capabilities.tools.listChanged false; tools/list returned 575 tools with inputSchema. See mcp/2s-io-mcp.yml.'
- id: mcp-server-card
  name: MCP server card (SEP-1649)
  conforms: true
  evidence: https://2s.io/.well-known/mcp/server-card.json — 200, serverInfo + authentication {schemes [x402]} + tools[575]; saved under well-known/.
- id: json-rpc-2.0
  conforms: true
  evidence: 'Both /mcp and /a2a answer {"jsonrpc":"2.0", ...} with standard -32601 Method not found and -32000 for a GET on the POST-only MCP endpoint.'
