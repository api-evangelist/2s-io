  name: agents.json (Wildcard)
  version: 0.1.0
  conforms: true
  evidence: https://2s.io/.well-known/agents.json — agentsJson 0.1.0, six flows whose actions reference real operationIds (search_endpoints, …) in per-group OpenAPI sub-specs.
- id: openapi-3.1
  conforms: true
  version: 3.1.0
  evidence: openapi/2s-io-openapi.json openapi "3.1.0"; parses; 575 paths, 575 operations, every operation has summary, description, unique operationId, one tag, security, and 200/400/402/405/500/502 responses; 3 component schemas, 5 component responses, 1 component parameter, 1 securityScheme.
  gaps:
  - No top-level tags[] declarations (each operation is tagged with its group name but the tags are undefined at the document level); overlays/2s-io-openapi-overlay.yaml proposes them from the provider's catalog.txt group descriptions.
  - No examples in-spec (the 402 envelope's extensions.bazaar and /registry.json carry example inputs; the OpenAPI does not).
  - 429 RATE_LIMITED and 503 UPSTREAM_RATE_LIMIT are documented in the changelog but not declared as responses.
  - 10 of 575 operations declare a 200 with no schema (media endpoints returning raw bytes, e.g. ai.screenshot).
- id: openai-chat-completions-compatible
  name: OpenAI-compatible chat completions shape
  conforms: true
  evidence: 'openapi/2s-io-openapi.json ai_chat — "OpenAI-compatible chat completions … POST { model, messages, max_tokens?, temperature?, top_p?, stop? } and get back a standard chat.completion (choices[].message + usage)"; ai_image returns "OpenAI-style { created, data: [{ b64_json }] }".'
  note: A de-facto interface shape, not a standards-body specification; recorded because a client already speaking it integrates without a connector.
- id: ansi-x12
  name: ANSI ASC X12 EDI
  conforms: true
  domain_standard_signature: true
  evidence: 'openapi/2s-io-openapi.json edi_parse (850, 810, 856, 855, 997 transaction sets; ISA/GS/ST envelopes), edi_generate (850 / 810 / 856 with ISA/GS/ST…SE/GE/IEA, N1 loops, PO1/IT1, HL hierarchy, CTT/TDS), edi_ack (997 Functional Acknowledgment with AK1/AK2/AK5/AK9, status A/E/P/R/M/W/X).'
  note: The contract names the X12 message types, segments and envelope structure it emits and consumes — the domain-standard signature for B2B commerce integration. Conformance is by the provider's contract; no X12 document was exchanged.
