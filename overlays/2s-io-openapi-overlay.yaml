overlay: 1.0.0
info:
  title: API Evangelist overlay for the 2s OpenAPI
  version: '2026-09-19'
  description: 'Enhancements API Evangelist derived while profiling 2s on 2026-09-19: tag declarations from the
    provider''s catalog.txt, the error envelope observed live, the 429/503 throttle responses documented in the
    provider''s changelog, discovery-document cross-links, and idempotency/reversibility markers quoted from operation
    descriptions. The original spec is never mutated; apply this overlay to openapi/2s-io-openapi.json.'
extends: openapi/2s-io-openapi.json
x-generated: '2026-09-19'
x-method: generated
x-source:
- https://2s.io/openapi.json
- https://2s.io/catalog.txt
- https://2s.io/changelog.json
- https://2s.io/.well-known/2s-attestation.json
- GET https://2s.io/api/validate/iban?trial=1 (observed 400)
actions:
- target: $.info
  update:
    termsOfService: null
    x-apievangelist-note: No terms of service or privacy policy page exists on 2s.io (all conventional paths 404,
      2026-09-19); the status page carries the only published commitments.
- target: $.info
  description: Name the discovery documents the provider publishes but the spec does not reference
  update:
    x-discovery:
      apisJson: https://2s.io/apis.json
      apiCatalog: https://2s.io/.well-known/api-catalog
      llmsTxt: https://2s.io/llms.txt
      mcp: https://2s.io/mcp
      mcpServerCard: https://2s.io/.well-known/mcp/server-card.json
      a2aAgentCard: https://2s.io/.well-known/agent-card.json
      x402Manifest: https://2s.io/.well-known/x402
      status: https://2s.io/status.json
      changelog: https://2s.io/changelog.json
      attestation: https://2s.io/.well-known/2s-attestation.json
