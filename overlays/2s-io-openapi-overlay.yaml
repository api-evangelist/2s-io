- target: $
  update:
    externalDocs:
      description: 2s llms.txt — payment flow, discovery surfaces, SDKs and the full endpoint list
      url: https://2s.io/llms.txt
- target: $.servers[0]
  update:
    description: Single production origin; also hosts the MCP server (/mcp) and the A2A JSON-RPC endpoint (/a2a).
      No sandbox host — use ?trial=1 for a free real call.
- target: $.components.responses
  description: Add the two throttle responses the provider documents in changelog 1.80.1 but does not declare
  update:
    RateLimited:
      description: 429 RATE_LIMITED — 2s's own rate limiter (changelog 1.80.1). Back off client-side. No Retry-After
        header is documented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamRateLimit:
      description: 503 UPSTREAM_RATE_LIMIT — an upstream throttle, not the caller's limit; the provider says retry
        without client-side backoff (changelog 1.80.1).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
- target: $.components.schemas
  description: Declare the error envelope observed live on a trial 400 (2026-09-19)
  update:
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: UPPER_SNAKE code — BAD_REQUEST, RATE_LIMITED, UPSTREAM_RATE_LIMIT, RESULT_TOO_LARGE,
                NOT_FOUND observed or documented
              example: BAD_REQUEST
            message:
              type: string
              example: Invalid parameters.
            details:
              type: object
              description: Optional; on 400 a validation report with issues[] {code, expected, received, path[],
                message}
- target: $.components.responses.BadRequest
  update:
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorEnvelope'
        example:
          error:
            code: BAD_REQUEST
            message: Invalid parameters.
            details:
              issues:
              - code: invalid_type
                expected: string
                received: undefined
                path:
                - iban
                message: Required
- target: $.paths.*[?(@.operationId)]
  description: Wire the two documented throttle responses onto every operation
  update:
    responses:
      '429':
        $ref: '#/components/responses/RateLimited'
      '503':
        $ref: '#/components/responses/UpstreamRateLimit'
- target: $.paths.*[?(@.operationId)]
  description: Name the headers the provider documents on a paid 200 and on a signed response
  update:
    x-response-headers:
      X-PAYMENT-TX: on-chain settlement transaction of the x402 payment
      X-2s-Endpoint: endpoint id (attestation descriptor)
      X-2s-Attestation-Signature: present when ?sign=1 — EIP-191 signature over the canonical message; see https://2s.io/.well-known/2s-attestation.json
