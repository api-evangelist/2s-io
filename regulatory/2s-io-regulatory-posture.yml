  - {url: 'https://2s.io/accessibility/vpat', status: 404}
- signal: sbom
  urls:
  - {url: 'https://2s.io/security/sbom', status: 404}
  note: No bill of materials published. Never derived — search only. (The SDK monorepo is MIT and public, but a repository is not an SBOM.)
- signal: support_lifetime
  urls:
  - {url: 'https://2s.io/status', status: 200}
  note: 'The status page states "Breaking changes are versioned in the SDKs. New endpoints are additive." — a change policy, not a stated support period. Recorded in lifecycle/, not here.'
