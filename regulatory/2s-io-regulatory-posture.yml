  note: No residency choice or region statement. Response headers show Vercel iad1 (US-East) for every probe; that is an observation, not a published commitment.
- signal: global_privacy_control
  note: No published statement that Sec-GPC is honored. Not tested by sending a header.
- signal: age_assurance
  note: Nothing published; the service has no user accounts.
- signal: notice_and_action
  urls:
  - {url: 'https://2s.io/legal/report-content', status: 404}
  note: 'No report-content channel. feedback_send ($0.25 via x402) is a general contact channel to the team, not a notice-and-action process.'
- signal: transparency_report
  urls:
  - {url: 'https://2s.io/transparency', status: 404}
- signal: exit_assistance
  note: >-
    Nothing published as a policy. Structurally, every stored object is readable back through the API
    (store_kv-get/scan, store_doc-get, store_blob-get/list) and expires after 90 days untouched, and there is
    no account to close — but no export or portability commitment is written down.
