  - {url: 'https://2s.io/privacy', status: 404}
  - {url: 'https://2s.io/privacy-policy', status: 404}
  note: >-
    No privacy policy and no subprocessor list exist at any conventional path. The provider does disclose
    upstream data sources per response (data.source {provider, url, license}) and names its payment
    facilitator (Coinbase CDP, https://api.cdp.coinbase.com/platform/v2/x402) and hosting platform (Vercel,
    from response headers), but a per-response data attribution is not a dated subprocessor table and is not
    recorded as one.
- signal: data_subject_request
  urls:
  - {url: 'https://2s.io/privacy/requests', status: 404}
  - {url: 'https://2s.io/privacy', status: 404}
  note: No privacy policy, no DSR channel. The service's own design collects no account data ("no accounts, no API keys"); wallet-scoped stored data can be deleted by the wallet through store_*-delete, which is a product capability, not a published rights process.
- signal: incident_notification
  urls:
  - {url: 'https://2s.io/legal/dpa', status: 404}
  note: No DPA, no breach-notification commitment. The status page states best-effort uptime and no SLA.
- signal: ai_transparency
  urls:
  - {url: 'https://2s.io/ai/transparency', status: 404}
  - {url: 'https://2s.io/transparency', status: 404}
  note: >-
    The AI gateway endpoints (ai_chat, ai_council, ai_image, …) disclose in their contract descriptions that
    they route to named third-party models (GPT-5, Claude, Gemini, Grok, DeepSeek, Llama, Mistral) and that
    agent_knowledge-delta and several ai_* operations are "LLM-backed"; the status page adds "Not legal,
    financial, or professional advice." That is model disclosure inside the contract, not a published AI
    transparency statement toward end users, so it is not recorded as the signal.
- signal: training_data_summary
  note: 2s is a model consumer, not a model provider; no training-data summary is published and none is expected.
- signal: accessibility_conformance
  urls:
