  2026-08-21, releases tagged v1.79.23 … v1.82.0). Five packages are live on registries — the TypeScript SDK and
  MCP server on npm, the Python client and two Python agent-framework adapters on PyPI — and every registry
  answered with metadata (version + publish date recorded below, read from registry.npmjs.org, pypi.org/pypi and
  proxy.golang.org on 2026-09-19). Two more the README lists are not published: the Rust crate `twosio` does not
  exist on crates.io (404) and the README itself marks Go and Rust "x402 wire-up pending". The three core
  packages share version 1.82.0 published 2026-08-21, the same day as the newest GitHub release, and one month
  after the API's own latest changelog entry (1.80.5, 2026-07-22) — the SDKs are current with the API.
