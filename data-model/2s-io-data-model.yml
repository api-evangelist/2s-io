notes:
- The upstream entities the read endpoints return (Company, CVE, Patent, Filing, Airport, …) are not modelled here because 2s does not own them; each response names its owner in data.source.
- CallMeta's schema body is undeclared in the contract ("endpoint id, cost, caller kind, settlement details" in prose only).
