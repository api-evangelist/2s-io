summary: >-
  2s has no separate test environment, no test keys and no test-mode prefix — there are no keys at all.
  Production is the sandbox, and the rehearsal mechanism is TRIAL MODE: any endpoint accepts ?trial=1 (or the
  header X-2s-Trial: 1) for one free real call per endpoint per hour, running the real handler against real
  upstreams and marking the response meta.trial. The SDKs and MCP server expose the same switch. There is no
  dry run — a trial call has the same side effects as a paid one (a trial watcher is a real watcher).
test_vs_live:
  separate_environment: false
  key_prefixes: not applicable — no API keys exist
  note: One host, one payment model. Trial mode is the only "test mode"; the payment rail has no testnet option documented (Base and Solana mainnet only).
trial_mode:
  parameter: 'trial=1 (components.parameters.TrialMode, declared on all 575 operations)'
  header: 'X-2s-Trial: 1'
  allowance: one free real call per endpoint per hour
  marker: response meta.trial
  exclusions: ['feedback_send — "Trial calls are not accepted — this endpoint always requires payment."']
  after_exhaustion: the endpoint returns the normal 402 until the hour resets
  verbatim: 'Verify any endpoint works before funding a wallet: add ?trial=1 to the URL (or send header X-2s-Trial: 1) with NO payment. You get one free real call per endpoint per hour (the actual handler runs and returns real data, marked meta.trial).'
  examples_published:
  - {client: cURL, verbatim: 'curl "https://2s.io/api/validate/iban?iban=GB82WEST12345698765432&trial=1"'}
  - {client: TypeScript, verbatim: 'new TwoS({ trial: true }).validate.iban({ iban: "GB82WEST12345698765432" })'}
  - {client: Python, verbatim: 'TwoS(trial=True).validate.iban(iban="GB82WEST12345698765432")'}
  - {client: MCP, verbatim: 'npx -y @2sio/mcp --trial  (or TWOS_TRIAL=1)'}
  - {client: cURL, verbatim: 'curl "https://2s.io/api/weather/zip?zip=94103&trial=1"', source: 'https://2s.io/learn/x402/quickstart'}
