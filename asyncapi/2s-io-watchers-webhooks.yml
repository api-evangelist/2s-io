summary: '2s publishes no AsyncAPI document (no /asyncapi.yaml or .json, nothing in the GitHub org), so none is
  saved and none is fabricated. It does publish a real outbound-callback surface in its OpenAPI and llms.txt: 26
  watcher kinds (arm once, get an EIP-191-signed HTTP POST when the world changes), a time-driven schedule primitive,
  and a consent-gated pub/sub with fan-out to subscriber URLs. This file captures that catalog verbatim from the
  contract so the event surface is scored; it is a webhook catalog, not an AsyncAPI.'
delivery:
  transport: HTTPS POST to a caller-supplied callbackUrl (any http(s) URL)
  signing: EIP-191 personal_sign by the provider's published key — "verify offline"; header X-2s-Signature (named
    in pubsub_subscribe)
  retries: exponential backoff; a pub/sub subscriber that repeatedly fails delivery is auto-disabled
  pull_backstop: watchers_status returns recent deliveries (HTTP result, attempt count) and any UNDELIVERED events
    with full bodies; schedule_status likewise
  payload: caller-supplied payload JSON echoed verbatim in every callback (+ scheduleId, fireNumber, firedAt on
    schedules)
  confirmation: 'pub/sub only — a one-time challenge POST carrying X-2s-Confirmation-Token and {type: "2s_subscription_confirmation",
    token}; the endpoint must reply 2xx with that token before it receives messages'
  schema_published: false
  note: The callback BODY schema is not declared anywhere in the contract — only that it carries the echoed payload
    and is signed. An AsyncAPI would be the natural place for it and does not exist.
pricing:
  watcher: $0.125 flat per arm; default 30-day / 25-fire window, max 90 days / 1,000 fires; cancel refunds nothing
